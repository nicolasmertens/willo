<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" id="willo-manifest" href="manifest.json">
<link rel="apple-touch-icon" id="willo-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Willo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  html, body { margin: 0; padding: 0; background: #fff7e6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; overscroll-behavior: none; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  body { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; max-width: 900px; }
  .grid.home-empty { grid-template-columns: 1fr; max-width: 280px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; max-width: 480px; } .grid.home-empty { max-width: 280px; } }

  #install-card { position: fixed; z-index: 40; width: min(340px, calc(100vw - 24px)); background: #fff; border-radius: 22px; padding: 16px 16px 14px; box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.08); }
  #install-card[data-at="top-right"] { top: calc(env(safe-area-inset-top) + 58px); right: 10px; }
  #install-card[data-at="bottom-center"] { left: 50%; bottom: calc(env(safe-area-inset-bottom) + 62px); transform: translateX(-50%); }
  #install-card .install-aim { position: absolute; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111; }
  #install-card[data-at="top-right"] .install-aim { top: -50px; }
  #install-card[data-browser="safari"][data-at="top-right"] .install-aim { right: 108px; }
  #install-card[data-browser="chrome"][data-at="top-right"] .install-aim { right: 8px; }
  #install-card[data-browser="edge"][data-at="top-right"] .install-aim { right: 8px; }
  #install-card[data-at="bottom-center"] .install-aim { left: 50%; bottom: -54px; transform: translateX(-50%); }
  #install-card .install-aim svg { width: 28px; height: 28px; }
  #install-card .install-row { display: flex; align-items: center; gap: 12px; padding: 8px 2px; font-weight: 800; font-size: 17px; }
  #install-card .install-row + .install-row { border-top: 1px solid rgba(0,0,0,.06); }
  #install-card .install-row svg { width: 28px; height: 28px; flex: 0 0 28px; color: #111; }
  #install-card .install-n { width: 22px; height: 22px; border-radius: 50%; background: #111; color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; flex: 0 0 22px; }

  button.tile { display: block; aspect-ratio: 1 / 1; border: 0; border-radius: 26px; overflow: hidden; position: relative; background: #fff; padding: 0; cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.08); transition: transform .08s ease, box-shadow .08s ease, filter .08s ease; }
  button.tile:active, button.tile.pressing { transform: translateY(2px) scale(0.98); filter: brightness(1.08); box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.08); }
  button.tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  button.tile .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0)); color: #fff; font-weight: 800; font-size: clamp(18px, 2.4vw, 22px); text-shadow: 0 2px 6px rgba(0,0,0,0.5); letter-spacing: -0.01em; pointer-events: none; }

  button.tile .text-fallback { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; font-weight: 900; font-size: clamp(28px, 5vw, 48px); color: #2b2b2b; background: linear-gradient(135deg, #ffd8a8, #ffa94d); }
  button.tile img.missing { display: none; }
  button.tile img.missing + .text-fallback { display: flex; }

  button.tile-plus { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 4px dashed rgba(0,0,0,.14); box-shadow: none; }
  button.tile-plus .plus { font-size: 72px; font-weight: 200; line-height: 1; color: #2b2b2b; pointer-events: none; }
  button.tile-plus .label { position: static; background: none; color: #2b2b2b; text-shadow: none; padding: 8px 0 0; font-size: 18px; }
  .grid.home-pick { grid-template-columns: repeat(3, 1fr); max-width: 900px; }
  @media (max-width: 640px) { .grid.home-pick { grid-template-columns: 1fr; max-width: 480px; } }
  #home-hint { margin: 0; max-width: 520px; text-align: center; font-weight: 700; font-size: 15px; color: rgba(0,0,0,.45); }

  #child-card, #child-card * { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; touch-action: manipulation; pointer-events: auto; }
  #child-card { width: min(380px, calc(100vw - 32px)); background: #fff; border-radius: 26px; padding: 22px 20px 18px; box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.08); position: relative; z-index: 50; }
  #child-card h1 { margin: 0 0 14px; font-size: 24px; }
  #child-card label { display: block; font-weight: 800; margin: 10px 0; }
  #child-card input[type=text], #child-card input[type=date] { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 16px; padding: 12px; border-radius: 12px; border: 1px solid #ddd; background: #fff; min-height: 48px; }
  #child-card .photo-well { position: relative; margin-top: 8px; min-height: 96px; border: 3px dashed #111; border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #fffaf0; }
  #child-card .photo-well input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 32px; cursor: pointer; }
  #child-card .photo-well span { font-weight: 800; pointer-events: none; }
  #child-card .photo-well img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #child-card button { margin-top: 12px; width: 100%; border: 0; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 16px; background: #111; color: #fff; }
  #child-card .willo-err { color: #c0392b; min-height: 1.2em; font-weight: 800; }
</style>
</head>
<body>
  <section id="child-card" hidden></section>
  <section id="install-card" hidden></section>
  <main class="grid home-empty" id="home-grid"></main>
  <p id="home-hint" hidden></p>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
  });
}

// --- Toddler-proofing: kill all browser gestures (mirrors templates/taal.html) ---
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive: false });
document.addEventListener("gestureend", e => e.preventDefault(), { passive: false });

let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  if (e.target.closest("#child-card, #install-card, input, textarea, select, label, button")) return;
  const now = Date.now();
  if (now - lastTouchEnd <= 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("touchmove",  e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick",    e => e.preventDefault());

// --- Telemetry ---
const TEL_URL = "https://liedjes-logger.super-mud-e2ef.workers.dev/log";
const STORAGE_PREFIX = "liedjes_home";
const APP_VERSION = "home-2026-05-20";
const TEL_BUFFER_KEY = STORAGE_PREFIX + "_tel_buffer_v1";
const TEL_DEVICE_KEY = STORAGE_PREFIX + "_device_id_v1";
const TEL_FLUSH_INTERVAL_MS = 30000;
const TEL_MAX_BUFFER = 2000;

const SESSION_ID = ((crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random())).slice(0, 36);
let DEVICE_ID = "";
try {
  DEVICE_ID = localStorage.getItem(TEL_DEVICE_KEY) || "";
  if (!DEVICE_ID) { DEVICE_ID = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random()); localStorage.setItem(TEL_DEVICE_KEY, DEVICE_ID); }
} catch {}

let telBuffer = [];
try { telBuffer = JSON.parse(localStorage.getItem(TEL_BUFFER_KEY) || "[]"); } catch {}
function saveTelBuffer() { try { localStorage.setItem(TEL_BUFFER_KEY, JSON.stringify(telBuffer)); } catch {} }
function tel(type, payload) {
  telBuffer.push({ t: Date.now(), type, ...(payload || {}) });
  if (telBuffer.length > TEL_MAX_BUFFER) telBuffer.splice(0, telBuffer.length - TEL_MAX_BUFFER);
  saveTelBuffer();
}

let telFlushing = false;
async function flushTel(useKeepalive) {
  if (telFlushing || telBuffer.length === 0) return;
  telFlushing = true;
  const batchLen = telBuffer.length;
  const batch = telBuffer.slice(0, batchLen);
  try {
    const resp = await fetch(TEL_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ events: batch, session_id: SESSION_ID, device_id: DEVICE_ID, app_version: APP_VERSION }),
      keepalive: !!useKeepalive,
    });
    if (resp && resp.ok) { telBuffer.splice(0, batchLen); saveTelBuffer(); }
  } catch {}
  telFlushing = false;
}
setInterval(() => flushTel(false), TEL_FLUSH_INTERVAL_MS);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushTel(true); });
window.addEventListener("pagehide", () => flushTel(true));
window.addEventListener("pageshow",  e => tel("pageshow", { persisted: !!e.persisted }));
tel("home_session_start", { ua: navigator.userAgent, vw: window.innerWidth, vh: window.innerHeight, dpr: window.devicePixelRatio || 1, standalone: !!(navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) });

// --- Tile tap detection (mirrors templates/taal.html bar nav-tile pattern) ---
const PALM_RADIUS_PX  = 60;
const MIN_TAP_MS      = 65;
const MAX_TAP_MS      = 1500;
const MAX_TAP_DRIFT_PX = 50;

function attachTileHandlers(btn) {
  const href  = btn.dataset.href;
  const label = btn.dataset.label;
  const candidates = new Map();

  btn.addEventListener("touchstart", e => {
    for (const t of e.changedTouches) {
      const r0 = Math.max(t.radiusX || 0, t.radiusY || 0);
      if (r0 > PALM_RADIUS_PX) {
        tel("home_palm_reject", { label, r: Math.round(r0) });
        continue;
      }
      candidates.set(t.identifier, { t0: Date.now(), x0: t.clientX, y0: t.clientY, drifted: false, r0 });
      btn.classList.add("pressing");
      tel("home_touchstart", { label, r: Math.round(r0), touches: e.touches.length });
    }
  }, { passive: true });

  btn.addEventListener("touchmove", e => {
    for (const t of e.changedTouches) {
      const c = candidates.get(t.identifier);
      if (!c) continue;
      const d = Math.hypot(t.clientX - c.x0, t.clientY - c.y0);
      if (d > MAX_TAP_DRIFT_PX) c.drifted = true;
    }
  }, { passive: true });

  btn.addEventListener("touchend", e => {
    for (const t of e.changedTouches) {
      const c = candidates.get(t.identifier);
      candidates.delete(t.identifier);
      if (candidates.size === 0) btn.classList.remove("pressing");
      if (!c) continue;
      const dur = Date.now() - c.t0;
      const r = Math.max(t.radiusX || 0, t.radiusY || 0);
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const onBtn = el === btn || btn.contains(el);
      let decision;
      if (c.drifted)             decision = "drifted";
      else if (!onBtn)           decision = "off_tile";
      else if (dur < MIN_TAP_MS) decision = "too_short";
      else if (dur > MAX_TAP_MS) decision = "too_long";
      else                       decision = "fire";
      tel("home_touchend", { label, dur_ms: dur, r_start: Math.round(c.r0), r_end: Math.round(r), on_btn: onBtn, decision });
      if (decision === "fire") {
        e.preventDefault();
        window.location = href;
        return;
      }
    }
  }, { passive: false });

  btn.addEventListener("touchcancel", e => {
    for (const t of e.changedTouches) candidates.delete(t.identifier);
    if (candidates.size === 0) btn.classList.remove("pressing");
    tel("home_touchcancel", { label });
  }, { passive: true });

  btn.addEventListener("click", e => {
    if ("ontouchstart" in window) return;
    if (e.detail === 0) return;
    tel("home_click", { label });
    window.location = href;
  });
}

window.addEventListener("load", () => {
  if (window.WilloHold) {
    WilloHold.attach(document, {
      shouldStart(e) {
        if (e.target.closest("input, textarea, select, label, button, a")) return false;
        if (e.target.closest("#child-card, #install-card, #willo-mask, #willo-sheet, .willo-sheet, button.tile")) return false;
        return true;
      },
      onHold() { if (window.WilloUI) WilloUI.openUnlock(); },
    });
  }
  if (window.WilloUI) WilloUI.boot();
});
</script>
<script src="scripts/willo-hold.js"></script>
<script src="scripts/willo-settings.js"></script>
<script src="scripts/willo-settings-ui.js"></script>
</body>
</html>
