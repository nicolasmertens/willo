<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Willo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@450;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  html, body { margin: 0; padding: 0; background: #fff7e6; font-family: Figtree, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; overscroll-behavior: none; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  body { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; }
  body.onboard { background: #16132e; color: #fff6e8; }
  body.onboard #home-grid, body.onboard #home-hint { display: none !important; }
  #boot-fallback { position: fixed; inset: 0; z-index: 30; background: #16132e; color: #fff6e8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; touch-action: manipulation; }
  body.booted #boot-fallback { display: none; }
  #boot-fallback, #boot-fallback * { pointer-events: auto; touch-action: manipulation; -webkit-user-select: auto; user-select: auto; }
  #boot-fallback h1 { margin: 0; font-family: Syne, sans-serif; font-size: 36px; }
  #boot-fallback a { color: #16132e; background: #f4c14e; text-decoration: none; font-weight: 800; padding: 16px 28px; border-radius: 999px; display: inline-block; min-height: 48px; line-height: 48px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; width: 100%; max-width: 900px; }
  .grid.home-empty { grid-template-columns: 1fr; max-width: 280px; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; max-width: 480px; } .grid.home-empty { max-width: 280px; } }

  #install-card { position: fixed; z-index: 40; width: min(360px, calc(100vw - 24px)); background: #211c45; color: #fff6e8; border-radius: 28px; padding: 22px 20px 18px; box-shadow: 0 18px 50px rgba(0,0,0,0.35); border: 1px solid rgba(244,193,78,0.28); }
  #install-card[data-at="top-right"] { top: calc(env(safe-area-inset-top) + 58px); right: 10px; }
  #install-card[data-at="bottom-center"] { left: 50%; bottom: calc(env(safe-area-inset-bottom) + 62px); transform: translateX(-50%); }
  #install-card .install-aim { position: absolute; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #f4c14e; }
  #install-card[data-at="top-right"] .install-aim { top: -52px; }
  #install-card[data-browser="safari"][data-at="top-right"] .install-aim { right: 108px; }
  #install-card[data-browser="chrome"][data-at="top-right"] .install-aim { right: 8px; }
  #install-card[data-browser="edge"][data-at="top-right"] .install-aim { right: 8px; }
  #install-card[data-at="bottom-center"] .install-aim { left: 50%; bottom: -54px; transform: translateX(-50%); }
  #install-card .install-aim svg { width: 30px; height: 30px; }
  #install-card .install-hero { width: 112px; height: 112px; border-radius: 28px; object-fit: cover; display: block; margin: 0 auto 12px; background: #2d2758; box-shadow: 0 0 0 4px #f4c14e; }
  #install-card .install-hero[hidden] { display: none; }
  #install-card .install-who { margin: 0 0 14px; text-align: center; font-family: Syne, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.03em; }
  #install-card .install-row { display: flex; align-items: center; gap: 12px; padding: 10px 2px; font-weight: 700; font-size: 17px; }
  #install-card .install-row + .install-row { border-top: 1px solid rgba(255,246,232,0.1); }
  #install-card .install-row svg { width: 28px; height: 28px; flex: 0 0 28px; color: #f4c14e; }

  button.tile { display: block; aspect-ratio: 1 / 1; border: 0; border-radius: 26px; overflow: hidden; position: relative; background: #fff; padding: 0; cursor: pointer; font-family: inherit; box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.08); transition: transform .08s ease, box-shadow .08s ease, filter .08s ease; }
  button.tile:active, button.tile.pressing { transform: translateY(2px) scale(0.98); filter: brightness(1.08); box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.08); }
  button.tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  button.tile .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0)); color: #fff; font-weight: 800; font-size: clamp(18px, 2.4vw, 22px); text-shadow: 0 2px 6px rgba(0,0,0,0.5); letter-spacing: -0.01em; pointer-events: none; }

  button.tile .text-fallback { display: none; width: 100%; height: 100%; align-items: center; justify-content: center; font-weight: 900; font-size: clamp(28px, 5vw, 48px); color: #2b2b2b; background: linear-gradient(135deg, #ffd8a8, #ffa94d); }
  button.tile img.missing { display: none; }
  button.tile img.missing + .text-fallback { display: flex; }

  button.tile-plus { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 4px dashed rgba(0,0,0,.14); box-shadow: none; }
  button.tile-plus .plus { font-size: 72px; font-weight: 200; line-height: 1; color: #2b2b2b; pointer-events: none; }
  button.tile-plus .label { position: static; background: none; color: #2b2b2b; text-shadow: none; padding: 8px 0 0; font-size: 18px; }
  .grid.home-pick { grid-template-columns: repeat(3, 1fr); max-width: 900px; }
  @media (max-width: 640px) { .grid.home-pick { grid-template-columns: 1fr; max-width: 480px; } }
  #home-hint { margin: 0; max-width: 520px; text-align: center; font-weight: 700; font-size: 15px; color: rgba(0,0,0,.45); }

  #child-card, #child-card * { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; touch-action: manipulation; pointer-events: auto; }
  #child-card, #hold-card { width: min(400px, calc(100vw - 32px)); position: relative; z-index: 50; }
  #child-card .stage-kicker, #hold-card .stage-kicker { margin: 0 0 8px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #f4c14e; font-weight: 700; }
  #child-card h1, #hold-card h1 { margin: 0 0 22px; font-family: Syne, sans-serif; font-weight: 800; font-size: clamp(34px, 8vw, 48px); letter-spacing: -0.04em; line-height: 0.95; color: #fff6e8; }
  #child-card .stage-field { display: block; margin: 0 0 16px; }
  #child-card .stage-field span { display: block; font-size: 13px; font-weight: 700; color: rgba(255,246,232,0.55); margin-bottom: 6px; }
  #child-card input[type=text], #child-card input[type=date] { display: block; width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 4px 0 10px; border: 0; border-bottom: 2px solid rgba(244,193,78,0.45); border-radius: 0; background: transparent; color: #fff6e8; min-height: 48px; }
  #child-card input[type=date]::-webkit-date-and-time-value { text-align: left; }
  #child-card .stage-sleeve { position: relative; display: block; margin: 22px 0 16px; aspect-ratio: 1 / 1; width: min(220px, 56vw); border-radius: 32px; overflow: hidden; background: #2d2758; box-shadow: 0 0 0 3px #f4c14e, 0 18px 40px rgba(0,0,0,0.35); }
  #child-card .stage-sleeve input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 32px; cursor: pointer; }
  #child-card .stage-sleeve-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; font-weight: 700; color: #fff6e8; pointer-events: none; }
  #child-card .stage-sleeve img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  #child-card .stage-sleeve img:not([hidden]) + .stage-sleeve-hint { display: none; }
  #child-card #child-go { margin-top: 8px; width: 100%; border: 0; border-radius: 999px; padding: 16px; font-family: Syne, sans-serif; font-weight: 800; font-size: 18px; background: #f4c14e; color: #16132e; }
  #child-card #child-go:disabled { opacity: 0.45; }
  #child-card .willo-err { color: #ff8b7b; min-height: 1.2em; font-weight: 700; }
  #hold-card { text-align: center; min-height: 70dvh; width: min(520px, calc(100vw - 32px)); display: flex; flex-direction: column; justify-content: center; }
  #hold-card .hold-blank { flex: 1; min-height: 36vh; margin: 12px 0; border-radius: 28px; background: rgba(244,193,78,0.06); box-shadow: inset 0 0 0 1px rgba(244,193,78,0.22); }
  #hold-card .hold-hint { margin: 0; font-size: 16px; font-weight: 600; color: rgba(255,246,232,0.62); }
  #home-blank { min-height: 28vh; width: 100%; max-width: 900px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; color: rgba(0,0,0,0.32); padding: 24px 12px; }
  body.onboard #home-blank { display: none !important; }
</style>
</head>
<body>
  <section id="boot-fallback">
    <p class="stage-kicker">Willo</p>
    <h1>Even laden</h1>
    <a id="boot-retry" href="https://nicolasmertens.github.io/willo/index.html?v=22">Opnieuw</a>
  </section>
  <section id="child-card" hidden></section>
  <section id="install-card" hidden></section>
  <section id="hold-card" hidden></section>
  <main class="grid home-empty" id="home-grid"></main>
  <div id="home-blank" hidden></div>
  <p id="home-hint" hidden></p>
<script>
(function () {
  try {
    if (new URLSearchParams(location.search).get("reset") === "1") {
      try { localStorage.removeItem("willo_settings_v2"); } catch (e) {}
      try { localStorage.removeItem("willo_kid_icon_id"); } catch (e) {}
      try { sessionStorage.removeItem("willo_show_install"); } catch (e) {}
      ["/", "/willo", "/willo/"].forEach(function (p) {
        document.cookie = "willo_bridge=;path=" + p + ";max-age=0;SameSite=Lax";
      });
      try { indexedDB.deleteDatabase("willo-photos"); } catch (e) {}
    }
  } catch (e) {}
  var srcs = [
    "scripts/willo-hold.js?v=22",
    "scripts/willo-settings.js?v=22",
    "scripts/willo-catalog.js?v=22",
    "scripts/willo-settings-ui.js?v=22"
  ];
  function loadScripts(i) {
    if (i >= srcs.length) {
      if (window.WilloUI && window.WilloUI.boot) window.WilloUI.boot();
      else {
        var a = document.getElementById("boot-retry");
        if (a) a.textContent = "Probeer opnieuw";
      }
      return;
    }
    var s = document.createElement("script");
    s.src = srcs[i];
    s.onload = function () { loadScripts(i + 1); };
    s.onerror = function () {
      var a = document.getElementById("boot-retry");
      if (a) a.textContent = "Probeer opnieuw";
    };
    document.body.appendChild(s);
  }
  function afterCache() {
    loadScripts(0);
  }
  var jobs = [];
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) { return r.unregister(); }));
    }));
  }
  if (window.caches) {
    jobs.push(caches.keys().then(function (keys) {
      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }));
  }
  Promise.all(jobs).then(afterCache, afterCache);
})();
</script>
</body>
</html>
