<title>Mama</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  html, body { margin: 0; padding: 0; background: #fff7e6; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; overscroll-behavior: none; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; min-height: 100dvh; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; max-width: 1200px; margin: 0 auto; }

  /* --- Section --- */
  section.taal-section { padding: 14px 14px 16px; border-radius: 24px; transition: opacity .2s ease; }
  section.taal-section h2 { font-size: 13px; color: rgba(0,0,0,0.45); text-transform: uppercase; letter-spacing: 0.10em; margin: 0 0 12px 4px; font-weight: 800; }
  section.boeken   { background: rgba(255, 193, 77, 0.13); }
  section.games    { background: rgba(171, 71, 188, 0.13); }
  section.liedjes  { background: rgba(95, 195, 76, 0.13); }
  section.verhalen { background: rgba(108, 140, 255, 0.13); }
  /* Default (no games, e.g. mama with 0 books): top-row is a plain container,
     Boeken renders full-width exactly as before. Split layout only when games
     exist (body.has-games). Boeken sizes to its actual content (currently 1
     tile on klas/papa; hidden entirely on mama, see .empty below) instead of
     a rigid 50/50 split, so Games can claim whatever space Boeken doesn't
     need. flex-wrap so the row itself can also fall back gracefully. */
  body.has-games .top-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  body.has-games .top-row > section { min-width: 0; }
  body.has-games .top-row > section.boeken { flex: 0 1 190px; }
  body.has-games .top-row > section.games  { flex: 1 1 200px; }
  @media (max-width: 900px) { body.has-games .top-row { flex-direction: column; align-items: stretch; } }

  section.taal-section.empty { display: none; }
  section.taal-section.dim { opacity: 0; pointer-events: none; }

  /* --- Grid: normal WRAPPING grid, fixed ~154px tiles (30% smaller than the
     old 220px horizontal-scroll-strip tiles that were removed from the
     top-row). auto-fill with a fixed track length computes however many
     columns fit the container's available width and wraps the rest onto new
     rows, so adding more items later needs no column-count edit and no
     manual breakpoint — that's exactly the kind of hardcoded-count bug the
     scroll strip was patched around earlier. Applies uniformly to all four
     sections (Boeken/Games in .top-row, Liedjes/Verhalen below) for visual
     consistency: same tile size everywhere, just more rows where there are
     more items (e.g. Liedjes). */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 154px); gap: 14px; }
  /* Hang is 12px on 1-2 sides only; 20px gap keeps a neighbor from touching. */
  section.liedjes .grid { gap: 20px; }

  /* --- Tile (same as grid.html) --- */
  .tile { aspect-ratio: 1 / 1; border: 4px solid transparent; border-radius: 22px; padding: 0; background: #fff; cursor: pointer; overflow: hidden; position: relative; box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.08); transition: transform .08s ease, box-shadow .08s ease; font-family: inherit; }
  .tile:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.08); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .tile .label { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px 12px; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0)); color: #fff; font-weight: 800; font-size: clamp(15px, 2vw, 19px); text-shadow: 0 2px 6px rgba(0,0,0,0.5); letter-spacing: -0.01em; }
  .tile.pressing { transform: scale(0.94); filter: brightness(1.12); }

  /* Liedjes audio only: card clips, art may leave it (fin/snout/trunk).
     Shadow stays on .tile-face so overflow is not boxed. Books/games unchanged. */
  section.liedjes,
  section.liedjes .grid { overflow: visible; }
  .tile.tile-audio {
    overflow: visible;
    border: none;
    background: transparent;
    box-shadow: none;
    z-index: 1;
  }
  .tile.tile-audio .tile-face {
    position: absolute; inset: 0; border-radius: 22px; background: var(--face, #fff);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.08);
    pointer-events: none; z-index: 0;
  }
  .tile.tile-audio img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; border-radius: 22px; z-index: 1;
  }
  .tile.tile-audio.tile-pop img {
    --hang: 12px;
    width: 154px; height: 154px; inset: auto; left: 0; top: 0;
    transform: none; border-radius: 0; object-fit: cover; object-position: center;
  }
  .tile.tile-audio.tile-pop.over-right img {
    width: calc(154px + var(--hang)); object-position: left center;
  }
  .tile.tile-audio.tile-pop.over-left img {
    width: calc(154px + var(--hang)); left: auto; right: 0; object-position: right center;
  }
  .tile.tile-audio.tile-pop.over-bottom img {
    height: calc(154px + var(--hang)); object-position: center top;
  }
  .tile.tile-audio.tile-pop.over-top img {
    height: calc(154px + var(--hang)); top: auto; bottom: 0; object-position: center bottom;
  }
  .tile.tile-audio.tile-pop.over-right.over-top img {
    width: calc(154px + var(--hang)); height: calc(154px + var(--hang));
    left: 0; right: auto; top: auto; bottom: 0; object-position: left bottom;
  }
  .tile.tile-audio.tile-pop.over-right.over-bottom img {
    width: calc(154px + var(--hang)); height: calc(154px + var(--hang));
    left: 0; right: auto; top: 0; bottom: auto; object-position: left top;
  }
  .tile.tile-audio.tile-pop.over-left.over-top img {
    width: calc(154px + var(--hang)); height: calc(154px + var(--hang));
    left: auto; right: 0; top: auto; bottom: 0; object-position: right bottom;
  }
  .tile.tile-audio.tile-pop.over-left.over-bottom img {
    width: calc(154px + var(--hang)); height: calc(154px + var(--hang));
    left: auto; right: 0; top: 0; bottom: auto; object-position: right top;
  }
  .tile.tile-audio:active { box-shadow: none; }
  .tile.tile-audio:active .tile-face { box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.08); }
  .tile.tile-audio.pressing { z-index: 2; }

  /* --- Top navigation banner (was bottom; William leans on bottom edge) --- */
  :root { --bar-h: 92px; --bar-pad: 10px; --bar-gap: 8px; }
  body { padding-top: calc(var(--bar-h) + var(--bar-pad) * 2 + max(8px, env(safe-area-inset-top))); }

  .bottombar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 100;
    padding: max(var(--bar-pad), env(safe-area-inset-top)) var(--bar-pad) var(--bar-pad) var(--bar-pad);
    background: rgba(255, 247, 230, 0.96);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.10);
    display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: var(--bar-gap);
  }
  .bottombar > button {
    height: var(--bar-h); padding: 0; border-radius: 18px; border: 3px solid #fff;
    background: #fff; overflow: hidden; cursor: pointer; font-family: inherit;
    position: relative;
  }
  .bottombar .navtile { background: #ffe0b2; }
  .bottombar .navtile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .bottombar .navtile img.missing { display: none; }
  .bottombar .navtile.active { border-color: #ff7043; box-shadow: 0 0 0 3px rgba(255,112,67,0.25); }
  .bottombar .stopbtn { background: #e53935; border-color: #fff; display: flex; align-items: center; justify-content: center; touch-action: none; -webkit-touch-callout: none; }
  .bottombar .stopbtn svg { width: 56%; height: 56%; fill: #fff; pointer-events: none; }
  .bottombar > button.pressing { transform: scale(0.94); filter: brightness(1.12); }

  /* --- Playing-mode lockdown: nav-tiles dimmed, stop pulses --- */
  body.playing .bottombar { background: rgba(0,0,0,0.85); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  body.playing .bottombar .navtile { opacity: 0.18; filter: grayscale(1); pointer-events: none; transition: opacity .2s, filter .2s; }
  body.playing .bottombar .stopbtn { animation: stoppulse 1.2s ease-in-out infinite; }
  @keyframes stoppulse {
    0%   { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); transform: scale(1.0); }
    50%  { box-shadow: 0 0 0 22px rgba(229, 57, 53, 0); transform: scale(1.05); }
    100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); transform: scale(1.0); }
  }

  /* --- Full-screen still playback overlay (sits above grid, BELOW chrome bar) --- */
  .player {
    position: fixed; left: 0; right: 0; bottom: 0;
    top: calc(var(--bar-h) + var(--bar-pad) * 2 + max(8px, env(safe-area-inset-top)));
    background: #000; display: none; z-index: 50;
  }
  .player.visible { display: block; }
  .player img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
</style>

<body data-page="mama">
  <div class="top-row">
    <section class="taal-section boeken" data-section="boeken">
      <h2>Livres</h2>
      <div class="grid" data-grid="boeken"></div>
    </section>
    <section class="taal-section games" data-section="games">
      <h2>Jeux</h2>
      <div class="grid grid-games" data-grid="games"></div>
    </section>
  </div>
  <section class="taal-section liedjes" data-section="liedjes">
    <h2>Chansons</h2>
    <div class="grid" data-grid="liedjes"></div>
  </section>
  <section class="taal-section verhalen" data-section="verhalen">
    <h2>Histoires</h2>
    <div class="grid" data-grid="verhalen"></div>
  </section>

  <div class="player" id="player"><img id="player-img" alt=""></div>

  <nav class="bottombar" id="bottombar" aria-label="navigatie">
    <button class="navtile" id="nav-mama" data-href="/willo/mama/" data-nav="mama" aria-label="mama"><img data-face="mama" alt="" class="missing"></button>
    <button class="navtile" id="nav-papa" data-href="/willo/papa/" data-nav="papa" aria-label="papa"><img data-face="papa" alt="" class="missing"></button>
    <button class="navtile" id="nav-klas" data-href="/willo/klas/" data-nav="klas" aria-label="klas"><img data-face="klas" alt="" class="missing"></button>
    <button class="stopbtn" id="stopbtn" aria-label="stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
  </nav>

<script>
// --- Service worker + standard PWA update flow ---
// Reload exactly once when a NEW worker takes control. No HTML polling,
// no reload loops — uses the canonical controllerchange event.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    }).catch(function () {});
    schedulePrefetch();
  });
}

// --- Toddler-proofing ---
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturechange", e => e.preventDefault(), { passive: false });
document.addEventListener("gestureend", e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", e => { const now = Date.now(); if (now - lastTouchEnd <= 350) e.preventDefault(); lastTouchEnd = now; }, { passive: false });
document.addEventListener("touchstart", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

const ALL_TRACKS = [{"n": 1, "title": "Mémoire", "icon": "/willo/klas/games/hero-memory.jpg", "href": "/willo/mama/games/memory/", "_section": "games"}, {"n": 2, "title": "Sons", "icon": "/willo/klas/games/hero-sounds.jpg", "href": "/willo/mama/games/soundboard/", "_section": "games"}, {"n": 3, "title": "Lequel ?", "icon": "/willo/klas/games/hero-pick.jpg", "href": "/willo/mama/games/pick/", "_section": "games"}, {"n": 1, "title": "Les roues de l'autobus", "audio": "liedjes/audio/01.mp3", "icon": "liedjes/icons/01.png", "irev": 4, "face": "#f0c01a", "over": ["bottom"], "fromMonth": 12, "_section": "liedjes"}, {"n": 2, "title": "L'araignée Gypsie", "audio": "liedjes/audio/02.mp3", "icon": "liedjes/icons/02.png", "irev": 2, "face": "#e07a2f", "over": ["left", "right"], "fromMonth": 12, "_section": "liedjes"}, {"n": 3, "title": "Il y avait de gros crocodiles", "audio": "liedjes/audio/03.mp3", "icon": "liedjes/icons/03.jpg", "irev": 2, "face": "#e6c31a", "fromMonth": 12, "_section": "liedjes"}, {"n": 4, "title": "Une souris verte", "audio": "liedjes/audio/04.mp3", "icon": "liedjes/icons/04.png", "irev": 2, "face": "#1d4ed8", "over": ["left"], "fromMonth": 12, "_section": "liedjes"}, {"n": 5, "title": "Les 3 poules", "audio": "liedjes/audio/05.mp3", "icon": "liedjes/icons/05.png", "irev": 2, "face": "#c46a3a", "over": ["bottom"], "fromMonth": 12, "_section": "liedjes"}, {"n": 6, "title": "Bateau sur l'eau", "audio": "liedjes/audio/06.mp3", "icon": "liedjes/icons/06.jpg", "irev": 2, "face": "#1aa3e6", "fromMonth": 12, "_section": "liedjes"}, {"n": 7, "title": "Au feu les pompiers", "audio": "liedjes/audio/07.mp3", "icon": "liedjes/icons/07.png", "irev": 3, "face": "#c0392b", "over": ["left", "top"], "fromMonth": 12, "_section": "liedjes"}, {"n": 8, "title": "La chanson de l'alphabet", "audio": "liedjes/audio/08.mp3", "icon": "liedjes/icons/08.png", "irev": 2, "face": "#2aa8a8", "over": ["left"], "fromMonth": 18, "_section": "liedjes"}, {"n": 9, "title": "Bébé Requin", "audio": "liedjes/audio/09.mp3", "icon": "liedjes/icons/09.png", "irev": 2, "face": "#1a6db5", "over": ["top", "left"], "fromMonth": 12, "_section": "liedjes"}, {"n": 10, "title": "Un tout petit doigt", "audio": "liedjes/audio/10.mp3", "icon": "liedjes/icons/10.png", "rev": 2, "irev": 2, "face": "#efc44a", "over": ["top"], "fromMonth": 12, "_section": "liedjes"}, {"n": 11, "title": "Le vieux MacDonald", "audio": "liedjes/audio/11.mp3", "icon": "liedjes/icons/11.png", "irev": 2, "face": "#5eb3e6", "over": ["left"], "fromMonth": 12, "_section": "liedjes"}];
const SEED_ORDER = ["liedjes:1", "liedjes:2", "liedjes:3", "liedjes:4", "liedjes:5"];
const PARENT_HREF = "/willo/";
const STORAGE_PREFIX = "mama";
const APP_VERSION = "mama-e933d918";

const audio = new Audio();
audio.preload = "none";
audio.playsInline = true;
let currentTile = null;
let currentTrack = null;

// --- Popularity tracking, keyed "<section>:<n>" ---
const POP_KEY = STORAGE_PREFIX + "_plays_v1";
const POP_WINDOW_MS = 14 * 24 * 60 * 60 * 1000;

function trackKey(t) { return `${t._section}:${t.n}`; }
function loadPlays() { try { return JSON.parse(localStorage.getItem(POP_KEY) || "[]"); } catch { return []; } }
function savePlays(arr) { try { localStorage.setItem(POP_KEY, JSON.stringify(arr)); } catch {} }
function recordPlay(t) {
  const now = Date.now(); const cutoff = now - POP_WINDOW_MS;
  const arr = loadPlays().filter(e => e.t >= cutoff);
  arr.push({ k: trackKey(t), t: now }); savePlays(arr);
}

function audioPrefetchOrder() {
  // Only audio tracks (link tiles don't need prefetch). Sort by play count desc, seed order, then natural order.
  const cutoff = Date.now() - POP_WINDOW_MS;
  const arr = loadPlays().filter(e => e.t >= cutoff);
  savePlays(arr);
  const counts = {};
  for (const e of arr) counts[e.k] = (counts[e.k] || 0) + 1;
  const seedRank = {};
  SEED_ORDER.forEach((k, i) => { seedRank[k] = i; });
  const audioTracks = ALL_TRACKS.filter(t => t.audio);
  audioTracks.sort((a, b) => {
    const ka = trackKey(a), kb = trackKey(b);
    const ca = counts[ka] || 0, cb = counts[kb] || 0;
    if (cb !== ca) return cb - ca;
    const sa = seedRank[ka] ?? 999, sb = seedRank[kb] ?? 999;
    if (sa !== sb) return sa - sb;
    return 0;
  });
  return audioTracks;
}

// --- Telemetry (same Worker as before) ---
const TEL_URL = "https://liedjes-logger.super-mud-e2ef.workers.dev/log";
const TEL_BUFFER_KEY = STORAGE_PREFIX + "_tel_buffer_v1";
const TEL_DEVICE_KEY = STORAGE_PREFIX + "_device_id_v1";
const TEL_FLUSH_INTERVAL_MS = 30000;
const TEL_MAX_BUFFER = 2000;
const SESSION_ID = ((crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random())).slice(0, 36);
let DEVICE_ID = "";
try { DEVICE_ID = localStorage.getItem(TEL_DEVICE_KEY) || ""; if (!DEVICE_ID) { DEVICE_ID = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + "-" + Math.random()); localStorage.setItem(TEL_DEVICE_KEY, DEVICE_ID); } } catch {}
let telBuffer = [];
try { telBuffer = JSON.parse(localStorage.getItem(TEL_BUFFER_KEY) || "[]"); } catch {}
function saveTelBuffer() { try { localStorage.setItem(TEL_BUFFER_KEY, JSON.stringify(telBuffer)); } catch {} }
function tel(type, payload) {
  telBuffer.push({ t: Date.now(), type, ...(payload || {}) });
  if (telBuffer.length > TEL_MAX_BUFFER) telBuffer.splice(0, telBuffer.length - TEL_MAX_BUFFER);
  saveTelBuffer();
}
let telFlushing = false;
async function flushTel(useKeepalive) {
  if (telFlushing || telBuffer.length === 0) return;
  telFlushing = true;
  const batchLen = telBuffer.length;
  const batch = telBuffer.slice(0, batchLen);
  try {
    const resp = await fetch(TEL_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ events: batch, session_id: SESSION_ID, device_id: DEVICE_ID, app_version: APP_VERSION }), keepalive: !!useKeepalive });
    if (resp && resp.ok) { telBuffer.splice(0, batchLen); saveTelBuffer(); }
  } catch {}
  telFlushing = false;
}
setInterval(() => flushTel(false), TEL_FLUSH_INTERVAL_MS);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushTel(true); });
window.addEventListener("pagehide", () => flushTel(true));
tel("session_start", { ua: navigator.userAgent, vw: window.innerWidth, vh: window.innerHeight, dpr: window.devicePixelRatio || 1, standalone: !!(navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) });

// Audio URL with optional ?v=rev so re-encoded tracks bust SW/browser cache
// (same path alone is cache-first and keeps the old short mp3 forever).
function audioUrl(track) {
  if (!track || !track.audio) return "";
  let u = track.audio;
  if (track.rev != null) u += (u.includes("?") ? "&" : "?") + "v=" + track.rev;
  return encodeURI(u);
}

function iconUrl(track) {
  if (!track || !track.icon) return "";
  let u = track.icon;
  if (track.irev != null) u += (u.includes("?") ? "&" : "?") + "v=" + track.irev;
  return encodeURI(u);
}

function playerStillUrl(track) {
  if (!track) return "";
  if (track.still) return iconUrl({ ...track, icon: track.still });
  if (track.icon && /\.png$/i.test(track.icon)) {
    return iconUrl({ ...track, icon: track.icon.replace(/\.png$/i, ".jpg") });
  }
  return iconUrl(track);
}

// --- Prefetch ---
async function schedulePrefetch() {
  let worker = navigator.serviceWorker.controller;
  if (!worker) { try { const reg = await navigator.serviceWorker.ready; worker = navigator.serviceWorker.controller || reg.active; } catch {} }
  if (!worker) return;
  const tracks = audioPrefetchOrder();
  const urls = tracks.map(t => audioUrl(t)).filter(Boolean);
  worker.postMessage({ type: "prefetch-mp3s", urls });
}

// --- Full-screen still playback ---
const player = document.getElementById("player");
const playerImg = document.getElementById("player-img");

// Timed slideshow: optional per-track `frames` [{t, src}] synced to audio time.
// No frames => single still (track.icon), unchanged behaviour.
let slideFrames = null;
let slideIdx = -1;
function setupSlideshow(track) {
  slideFrames = (track.frames && track.frames.length) ? track.frames.slice().sort((a, b) => a.t - b.t) : null;
  slideIdx = -1;
  if (slideFrames) {
    slideFrames.forEach(f => { const im = new Image(); im.src = encodeURI(f.src); }); // preload for instant swaps
    applySlideFrame(0);
  }
}
function applySlideFrame(time) {
  if (!slideFrames) return;
  let i = 0;
  for (let j = 0; j < slideFrames.length; j++) { if (slideFrames[j].t <= time + 0.001) i = j; else break; }
  if (i !== slideIdx) { slideIdx = i; playerImg.src = encodeURI(slideFrames[i].src); }
}
function clearSlideshow() { slideFrames = null; slideIdx = -1; }

function showPlayer(track) {
  if (track.frames && track.frames.length) { setupSlideshow(track); }
  else { clearSlideshow(); playerImg.src = playerStillUrl(track); }
  player.classList.add("visible"); document.body.classList.add("playing"); document.querySelectorAll('section.taal-section').forEach(s => s.classList.add('dim'));
}
function hidePlayer() { clearSlideshow(); player.classList.remove("visible"); document.body.classList.remove("playing"); document.querySelectorAll('section.taal-section').forEach(s => s.classList.remove('dim')); playerImg.src = ""; }

let isPlaying = false;
let currentSongKey = null;
let lastProgressLog = 0;

function emitPlayEnd(reason) {
  if (currentSongKey == null) return;
  const dur = audio.duration || 0, cur = audio.currentTime || 0;
  const pct = dur > 0 ? +(cur / dur).toFixed(3) : 0;
  tel("play_end", { k: currentSongKey, elapsed_ms: Math.round(cur * 1000), duration_ms: Math.round(dur * 1000), pct, reason, real_tap: pct >= 0.4 });
  currentSongKey = null;
}

function stop() {

  function bindTap(el, fn) {
    let armed = null;
    let usedPointer = false;
    el.addEventListener("pointerdown", (e) => {
      if (e.isPrimary === false) return;
      armed = { id: e.pointerId, x: e.clientX, y: e.clientY, t: Date.now() };
    });
    el.addEventListener("pointerup", (e) => {
      if (!armed || armed.id !== e.pointerId) return;
      const dx = e.clientX - armed.x;
      const dy = e.clientY - armed.y;
      const dt = Date.now() - armed.t;
      armed = null;
      if (Math.hypot(dx, dy) > 28 || dt > 1500) return;
      usedPointer = true;
      e.preventDefault();
      fn();
    });
    el.addEventListener("pointercancel", () => { armed = null; });
    el.addEventListener("click", (e) => {
      if (usedPointer) {
        e.preventDefault();
        return;
      }
      fn();
    });
  }

  function bind(mask) {
    if (!mask.dataset.bound) {
      mask.dataset.bound = "1";
      mask.addEventListener("click", (e) => { if (e.target === mask) close(); });
    }
    mask.querySelectorAll("[data-close]").forEach((b) => bindTap(b, close));
    mask.querySelectorAll("[data-k]").forEach((b) => bindTap(b, () => digit(b.getAttribute("data-k"))));
    mask.querySelectorAll("[data-drill]").forEach((b) => bindTap(b, () => {
      sheetView = "section";
      sheetSec = b.getAttribute("data-drill");
      mount(renderSheet());
    }));
    mask.querySelectorAll("[data-drill-faces]").forEach((b) => bindTap(b, () => {
      sheetView = "faces";
      mount(renderSheet());
    }));
    mask.querySelectorAll("[data-back]").forEach((b) => bindTap(b, () => {
      sheetView = "root";
      mount(renderSheet());
    }));
    mask.querySelectorAll("[data-lang]").forEach((el) => el.addEventListener("change", () => {
      const r = S.setLang(S.load(), el.getAttribute("data-lang"), el.checked);
      if (!r.ok) { el.checked = !el.checked; return; }
      S.save(r.state); applyLangs(); mount(renderSheet());
    }));
    mask.querySelectorAll("[data-add-lang]").forEach((b) => bindTap(b, () => {
      const lang = b.getAttribute("data-add-lang");
      const r = S.setLang(S.load(), lang, true);
      if (r.ok) S.save(r.state);
      close();
      applyLangs();
    }));
    mask.querySelectorAll("[data-sec]").forEach((el) => el.addEventListener("change", () => {
      const r = S.setSection(S.load(), el.getAttribute("data-sec"), el.checked);
      S.save(r.state); applyCatalog(); mount(renderSheet());
    }));
    mask.querySelectorAll("[data-item]").forEach((el) => el.addEventListener("change", () => {
      const [taal, sec, n] = el.getAttribute("data-item").split(":");
      const r = S.setItem(S.load(), taal, sec, Number(n), el.checked);
      S.save(r.state); applyCatalog(); mount(renderSheet());
    }));
    const birth = mask.querySelector("#willo-birth");
    if (birth) birth.addEventListener("change", () => {
      const r = S.setBirth(S.load(), birth.value);
      if (r.ok) { S.save(r.state); mount(renderSheet()); applyCatalog(); }
    });
    mask.querySelectorAll("[data-photo]").forEach((el) => el.addEventListener("change", async () => {
      const f = el.files && el.files[0];
      if (!f) return;
      const url = await fileToData(f);
      await photoSet(el.getAttribute("data-photo"), url);
      await applyFaceImages();
    }));
    const exp = mask.querySelector("[data-export]");
    if (exp) exp.addEventListener("click", doExport);
    const refresh = mask.querySelector("[data-refresh]");
    if (refresh) bindTap(refresh, () => {
      Promise.resolve()
        .then(() => window.caches ? caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))) : null)
        .then(() => navigator.serviceWorker && navigator.serviceWorker.getRegistrations
          ? navigator.serviceWorker.getRegistrations().then((rs) => Promise.all(rs.map((r) => r.unregister())))
          : null)
        .then(() => { location.reload(); })
        .catch(() => { location.reload(); });
    });
    const imp = mask.querySelector("[data-import]");
    const file = mask.querySelector("#willo-import");
    if (imp && file) {
      imp.addEventListener("click", () => file.click());
      file.addEventListener("change", () => { if (file.files[0]) doImport(file.files[0]); });
    }
  }

  function fileToData(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function doExport() {
    const photos = await allPhotos();
    const payload = S.exportPayload(S.load(), photos);
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const file = new File([blob], "willo-settings.json", { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Willo" });
        return;
      }
    } catch (e) {}
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "willo-settings.json";
    a.click();
  }

  async function doImport(file) {
    const text = await file.text();
    const r = S.importPayload(text);
    if (!r.ok) return;
    S.save(r.state);
    for (const l of S.LANGS) {
      if (r.photos && r.photos[l]) await photoSet(l, r.photos[l]);
    }
    applyLangs();
    applyCatalog();
    await applyFaceImages();
    renderHome();
    mount(renderSheet());
  }

  function digit(k) {
    if (typeof tel === "function") tel("pin_tap", { k: String(k), n: pinBuf.length });
    if (k === "⌫") { pinBuf = pinBuf.slice(0, -1); mount(renderGate()); return; }
    if (!/^\d$/.test(k) || pinBuf.length >= 4) return;
    pinBuf += k;
    mount(renderGate());
    if (pinBuf.length < 4) return;
    const st = S.load();
    if (!st.pinHash) {
      const r = S.setPin(st, pinBuf);
      if (r.ok) S.save(r.state);
      pinBuf = "";
      sessionOk = true;
      afterPin();
      return;
    }
    const chk = S.checkPin(st, pinBuf);
    pinBuf = "";
    if (!chk.ok) {
      mount(renderGate());
      const err = document.getElementById("willo-err");
      if (err) err.textContent = "Fout";
      return;
    }
    sessionOk = true;
    afterPin();
  }

  function afterPin() {
    if (pendingAfterPin === "add") {
      pendingAfterPin = "";
      mode = "add";
      mount(renderAddLang());
      return;

    mode = "sheet";

  const SVG_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.2 8.5H7A2.5 2.5 0 0 0 4.5 11v8A2.5 2.5 0 0 0 7 21.5h10a2.5 2.5 0 0 0 2.5-2.5v-8A2.5 2.5 0 0 0 17 8.5h-1.2"/><path d="M12 15.5V3.5"/><path d="M8 7l4-4 4 4"/></svg>';

  function squareBlob(src, size) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const ctx = c.getContext("2d");
        const s = Math.min(img.width, img.height);
        const sx = (img.width - s) / 2;
        const sy = (img.height - s) / 2;
        ctx.fillStyle = "#fff7e6";
        ctx.fillRect(0, 0, size, size);
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        c.toBlob((b) => (b ? res(b) : rej(new Error("blob"))), "image/png");
      };
      img.onerror = () => rej(new Error("img"));
      img.src = src;
    });
  }

  async function cacheKidIcon(blob, file) {
    const cache = await caches.open("willo-kid-icon-v1");
    const abs = new URL(file, location.href);
    abs.search = "";
    const resp = new Response(blob, { headers: { "Content-Type": "image/png", "Cache-Control": "no-cache" } });
    await cache.put(abs.href, resp);
    return abs.href;
  }

  function tellWorkerKid(name) {
    try {
      if (!navigator.serviceWorker) return;
      const send = (w) => { if (w) w.postMessage({ type: "willo-kid", name: name || "" }); };
      if (navigator.serviceWorker.controller) send(navigator.serviceWorker.controller);
      navigator.serviceWorker.ready.then((reg) => send(reg.active)).catch(() => {});
    } catch (e) {}
  }

  function blobToData(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  function dropStockIcons(paths) {
    document.querySelectorAll("link[rel='apple-touch-icon'], link[rel='icon'], link[rel='manifest']").forEach((el) => {
      if (el.rel === "manifest") {
        el.remove();
        return;
      }
      const href = String(el.getAttribute("href") || "");
      if (paths.some((p) => href.indexOf(p) !== -1)) el.remove();
    });
  }

  function ensureTouchIcon(id) {
    let el = document.getElementById(id);
    if (el) return el;
    el = document.createElement("link");
    el.id = id;
    el.rel = "apple-touch-icon";
    el.setAttribute("sizes", "180x180");
    document.head.appendChild(el);
    return el;
  }

  function setTouchHref(href) {
    if (!href || String(href).indexOf("data:") === 0) return;
    const icon = ensureTouchIcon("willo-touch-icon");
    icon.rel = "apple-touch-icon";
    icon.setAttribute("sizes", "180x180");
    icon.href = href;
    let pre = document.getElementById("willo-touch-icon-pre");
    if (!pre) {
      pre = document.createElement("link");
      pre.id = "willo-touch-icon-pre";
      pre.rel = "apple-touch-icon-precomposed";
      pre.setAttribute("sizes", "180x180");
      document.head.appendChild(pre);
    }
    pre.href = href;
    let fav = document.querySelector("link[rel='icon']");
    if (!fav) {
      fav = document.createElement("link");
      fav.rel = "icon";
      fav.type = "image/png";
      document.head.appendChild(fav);
    }
    fav.href = href;
  }

  function kidPublicUrl(id) {
    return KID_API + "/kid/" + id + ".png";
  }

  async function probeKid(id) {
    if (!id) return false;
    try {
      const resp = await withTimeout(fetch(kidPublicUrl(id), { method: "GET", cache: "no-store" }), 4000);
      if (!resp.ok) return false;
      const t = String(resp.headers.get("content-type") || "");
      return t.indexOf("png") !== -1;
    } catch (e) {
      return false;
    }
  }

  function saveKidId(id) {
    try { localStorage.setItem(KID_ID_KEY, id || ""); } catch (e) {}
  }

  function loadKidId() {
    try { return localStorage.getItem(KID_ID_KEY) || ""; } catch (e) { return ""; }
  }

  function withTimeout(p, ms) {
    return Promise.race([
      p,
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms)),
    ]);
  }

  async function uploadKidIcon(blob) {
    const resp = await withTimeout(fetch(KID_API + "/kid", {
      method: "POST",
      headers: { "Content-Type": "image/png" },
      body: blob,
    }), 4000);
    if (!resp.ok) throw new Error("kid-up");
    const data = await resp.json();
    if (!data || !data.url || !data.id) throw new Error("kid-up");
    saveKidId(data.id);
    return data;
  }

  function stampChildUrl(state, extra) {
    try {
      const u = new URL(location.href);
      u.searchParams.set("n", S.springboardName(state.childName));
      u.searchParams.set("b", state.birth);
      u.searchParams.set("f", "1");
      if (extra && extra.k) u.searchParams.set("k", extra.k);
      if (extra && extra.a2hs) u.searchParams.set("a2hs", "1");
      const next = u.pathname + "?" + u.searchParams.toString();
      history.replaceState({}, "", next);
      return next;
    } catch (e) {
      return "";
    }
  }

  async function forgetKidIcon() {
    const id = loadKidId();
    if (!id) return;
    try {
      await fetch(KID_API + "/kid/" + id, { method: "DELETE" });
    } catch (e) {}
    saveKidId("");
  }

  async function applySpringboard(name, dataUrl, opts) {
    const tags = S.springboardTags(name);
    let title = document.querySelector("meta[name='apple-mobile-web-app-title']");
    if (!title) {
      title = document.createElement("meta");
      title.setAttribute("name", "apple-mobile-web-app-title");
      document.head.appendChild(title);
    }
    title.setAttribute("content", tags.title);
    document.title = tags.title;
    if (tags.detachManifest) dropStockIcons(tags.stockIconPaths);
    tellWorkerKid(tags.title);
    const allowUpload = !(opts && opts.allowUpload === false);
    let id = loadKidId() || S.kidIdFromSearch(location.search);
    if (id && await probeKid(id)) {
      setTouchHref(kidPublicUrl(id));
      saveKidId(id);
      return id;
    }
    if (!allowUpload || !dataUrl) return "";
    const b180 = await squareBlob(dataUrl, 180);
    try { await cacheKidIcon(b180, "kid-icon-180.png"); } catch (e) {}
    const extra = document.getElementById("willo-touch-icon-file");
    if (extra) extra.remove();
    const up = await uploadKidIcon(b180);
    if (!up || !up.id || !(await probeKid(up.id))) throw new Error("kid-get");
    setTouchHref(kidPublicUrl(up.id));
    tellWorkerKid(tags.title);
    return up.id;
  }

  async function submitChild() {
    const nameEl = document.getElementById("child-name");
    const birthEl = document.getElementById("child-birth");
    const photoEl = document.getElementById("child-photo");
    const err = document.getElementById("child-err");
    const file = photoEl && photoEl.files && photoEl.files[0];
    const r = S.setChild(S.load(), nameEl ? nameEl.value : "", birthEl ? birthEl.value : "");
    if (!r.ok) {
      if (err) err.textContent = "!";
      return;
    }
    const existing = await photoGet("child");
    if (!file && !existing && !r.state.childFace) {
      if (err) err.textContent = "!";
      return;
    }
    const go = document.getElementById("child-go");
    if (go) go.disabled = true;
    r.state.childFace = true;
    S.save(r.state);
    stampChildUrl(r.state);
    let kidId = "";
    try {
      let dataUrl = "";
      if (file) {
        dataUrl = await withTimeout(fileToData(file), 8000);
        try { await withTimeout(photoSet("child", dataUrl), 2500); } catch (e) {}
      } else {
        dataUrl = existing;
      }
      if (!dataUrl) throw new Error("photo");
      kidId = await withTimeout(applySpringboard(r.state.childName, dataUrl, { allowUpload: true }), 12000);
    } catch (e) {
      if (err) err.textContent = "!";
      if (go) go.disabled = false;
      return;
    }
    if (!kidId) {
      if (err) err.textContent = "!";
      if (go) go.disabled = false;
      return;
    }
    continuedThisLoad = true;
    try {
      const u = new URL(location.href);
      u.searchParams.set("n", S.springboardName(r.state.childName));
      u.searchParams.set("b", r.state.birth);
      u.searchParams.set("f", "1");
      u.searchParams.set("k", kidId);
      u.searchParams.set("a2hs", "1");
      const next = u.pathname + "?" + u.searchParams.toString();
      const same = S.wantsA2hs(location.search) && S.kidIdFromSearch(location.search) === kidId;
      if (same) {
        history.replaceState({}, "", next);
        if (go) go.disabled = false;
        renderHome();
        return;
      }
      location.replace(next);
    } catch (e) {
      if (go) go.disabled = false;
      renderHome();
    }
  }

  function installSessionFlags() {
    let left = false;
    let again = false;
    try {
      left = sessionStorage.getItem("willo_install_left") === "1";
      again = sessionStorage.getItem("willo_install_again") === "1";
    } catch (e) {}
    return { left: left, again: again };
  }

  function fillInstallFace() {
    photoGet("child").then((data) => {
      const img = document.getElementById("install-face");
      if (img && data) {
        img.src = data;
        img.hidden = false;
      }
    });
  }

  function paintInstall() {
    const el = document.getElementById("install-card");
    if (!el) return;
    const probe = Object.assign(iosProbe(), { width: window.innerWidth, height: window.innerHeight });
    const at = S.installShareAt(probe);
    const browser = S.installBrowser(probe.ua);
    const loc = navigator.language || document.documentElement.lang || "en";
    const copy = S.installCopy(loc);
    const flags = installSessionFlags();
    const coach = S.installCoachMode({
      standalone: isStandalone(),
      leftAndReturned: flags.left,
      forceSteps: flags.again,
    });
    const who = S.springboardName((S.load() || {}).childName) || "";
    el.dataset.at = at;
    el.dataset.browser = browser;
    el.dataset.coach = coach;
    document.documentElement.lang = String(loc).slice(0, 2);
    if (coach === "none") return;
    if (coach === "open") {
      el.innerHTML = `
        <img class="install-hero" id="install-face" alt="" hidden>
        <p class="install-who">${who}</p>
        <p class="install-open">${S.openIconLabel(loc, who)}</p>
        <button type="button" class="install-again" data-install-again>${copy.again}</button>
      `;
      const again = el.querySelector("[data-install-again]");
      if (again) bindTap(again, () => {
        try {
          sessionStorage.setItem("willo_install_again", "1");
          sessionStorage.removeItem("willo_install_left");
        } catch (e) {}
        paintInstall();
      });
      fillInstallFace();
      return;
    }
    const steps = S.installSteps(probe, loc, who);
    const step1icon = browser === "safari" ? SVG_SHARE : SVG_DOTS;
    const aim = at === "none" ? "" : `<div class="install-aim">${step1icon}</div>`;
    const rows = steps.map((s, i) =>
      `<div class="install-row" data-step="${s.id}"><span class="install-n">${i + 1}</span><span>${s.label}</span></div>`
    ).join("");
    el.innerHTML = `
      <img class="install-hero" id="install-face" alt="" hidden>
      <p class="install-who">${who}</p>
      ${aim}
      ${rows}
    `;
    fillInstallFace();
  }

  function paintHold() {
    const el = document.getElementById("hold-card");
    if (!el) return;
    const loc = navigator.language || document.documentElement.lang || "nl";
    const copy = S.holdCopy(loc);
    el.innerHTML = `
      <p class="stage-kicker">${copy.kicker}</p>
      <h1>${copy.title}</h1>
      <div class="hold-blank" id="hold-pad" aria-label="${copy.title}"></div>
      <p class="hold-hint">${copy.hint}</p>
    `;
    if (window.WilloHold) {
      WilloHold.attach(el, {
        onHold() { openUnlock(); },
        onTap() {},
      });
    }
    el.addEventListener("click", (e) => {
      if ("ontouchstart" in window) return;
      if (e.detail === 0) return;
      if (e.target.closest("button")) return;
      openUnlock();
    });
  }

  function openAddLang() {
    if (surfaceNow() === "install") return;
    const st = S.load();
    const off = S.LANGS.filter((l) => !S.isLangOn(st, l));
    if (!off.length) return;
    if (st.pinHash && !sessionOk) {
      pendingAfterPin = "add";
      openUnlock();
      return;
    }
    mode = "add";
    mount(renderAddLang());
  }

  function paintHint(text) {
    const hint = document.getElementById("home-hint");
    if (!hint) return;
    if (!text) {
      hint.hidden = true;
      hint.textContent = "";
      return;
    }
    hint.hidden = false;
    hint.textContent = text;
  }

  function enableLang(lang) {
    const r = S.setLang(S.load(), lang, true);
    if (r.ok) S.save(r.state);
    renderHome();
  }

  function renderHome() {
    const grid = document.getElementById("home-grid");
    const install = document.getElementById("install-card");
    if (!grid) return;
    const surface = surfaceNow();
    const child = document.getElementById("child-card");
    const hold = document.getElementById("hold-card");
    if (child) child.hidden = surface !== "child";
    if (install) install.hidden = surface !== "install";
    if (hold) hold.hidden = surface !== "hold";
    const staged = surface === "install" || surface === "child" || surface === "hold";
    grid.hidden = staged;
    const blank = document.getElementById("home-blank");
    if (blank && staged) blank.hidden = true;
    document.body.classList.toggle("onboard", staged);
    document.body.dataset.stage = surface;
    const loc = navigator.language || document.documentElement.lang || "nl";
    if (surface === "child") {
      grid.innerHTML = "";
      paintHint("");
      paintChild();
      return;
    }
    if (surface === "install") {
      grid.innerHTML = "";
      paintHint("");
      paintInstall();
      return;
    }
    if (surface === "hold") {
      grid.innerHTML = "";
      paintHint("");
      paintHold();
      return;
    }
    const st = S.load();
    const on = S.LANGS.filter((l) => S.isLangOn(st, l));
    const chrome = S.homeChrome(on.length);
    const pickLangs = on;
    grid.classList.toggle("home-empty", pickLangs.length === 1);
    grid.classList.toggle("home-pick", !!chrome.firstPick);
    const tiles = pickLangs.map((l) => `
      <button class="tile" data-href="/willo/${l}/" data-label="${l}" aria-label="${l}">
        <img data-face="${l}" alt="" class="missing">
        <div class="text-fallback" aria-hidden="true"></div>
      </button>`).join("");
    grid.innerHTML = tiles;
    if (blank) {
      blank.hidden = false;
      blank.textContent = S.holdHintCopy(loc);
    }
    paintHint("");
    grid.querySelectorAll("button.tile").forEach((btn) => {
      const pick = btn.dataset.pick === "1";
      if (window.WilloHold) {
        WilloHold.attach(btn, {
          onTap() {
            if (pick) enableLang(btn.dataset.label);
            else if (btn.dataset.href) window.location = btn.dataset.href;
          },
          onHold() { openUnlock(); },
        });
      }
      btn.addEventListener("click", (e) => {
        if ("ontouchstart" in window) return;
        if (e.detail === 0) return;
        if (pick) enableLang(btn.dataset.label);
        else if (btn.dataset.href) window.location = btn.dataset.href;
      });
    });
    applyFaceImages();
  }

  function applyLangs() {
    const st = S.load();
    S.LANGS.forEach((l) => {
      const on = S.isLangOn(st, l);
      document.querySelectorAll(`button.tile[data-label="${l}"]`).forEach((b) => {
        b.style.display = on ? "" : "none";
      });
      const nav = document.getElementById("nav-" + l);
      if (nav) nav.style.display = on ? "" : "none";
    });
    const PAGE = document.body.dataset && document.body.dataset.page;
    if (PAGE && S.LANGS.indexOf(PAGE) !== -1 && !S.isLangOn(st, PAGE)) {
      window.location = "/willo/";
    }
    renderHome();
  }

  function applyCatalog() {
    if (typeof build !== "function") return;
    document.querySelectorAll("[data-grid]").forEach((g) => { g.innerHTML = ""; });
    document.querySelectorAll("section.taal-section").forEach((s) => s.classList.remove("empty"));
    document.body.classList.remove("has-games");
    build();
    if (typeof refreshLiedjesOverflow === "function") refreshLiedjesOverflow();
    const st = S.load();
    S.SECTIONS.forEach((sec) => {
      const el = document.querySelector(`section[data-section="${sec}"]`);
      if (el && !S.isSectionOn(st, sec)) el.classList.add("empty");
    });
  }

  function openUnlock() {
    const surface = surfaceNow();
    if (surface === "install" || surface === "child") return;
    pinBuf = "";
    mode = "gate";
    sheetView = "root";
    sheetSec = "";
    if (typeof tel === "function") tel("pin_gate", { surface: surface });
    mount(renderGate());
  }

  function wantsReset() {
    try {
      return new URLSearchParams(location.search).get("reset") === "1";
    } catch (e) {
      return false;
    }
  }

  function wipeLocal() {
    try { localStorage.removeItem(S.KEY); } catch (e) {}
    try { localStorage.removeItem(KID_ID_KEY); } catch (e) {}
    try { sessionStorage.removeItem("willo_show_install"); } catch (e) {}
    try { sessionStorage.removeItem("willo_install_left"); } catch (e) {}
    try { sessionStorage.removeItem("willo_install_again"); } catch (e) {}
    try { document.cookie = "willo_bridge=;path=/;max-age=0;SameSite=Lax"; } catch (e) {}
    try { indexedDB.deleteDatabase("willo-photos"); } catch (e) {}
  }

  async function resetIfAsked() {
    if (!wantsReset()) return false;
    await forgetKidIcon();
    wipeLocal();
    try {
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.filter((k) => String(k).indexOf("willo") === 0).map((k) => caches.delete(k)));
      }
    } catch (e) {}
    location.replace(location.pathname + location.hash);
    return true;
  }

  async function boot() {
    document.body.classList.add("booted");
    const fallback = document.getElementById("boot-fallback");
    if (fallback) fallback.hidden = true;
    try { sessionStorage.removeItem("willo_show_install"); } catch (e) {}
    continuedThisLoad = false;
    if (await resetIfAsked()) return;
    if (isStandalone()) forgetKidIcon();
    applyLangs();
    applyCatalog();
    applyFaceImages();
    const st = S.load();
    if (!isStandalone() && S.hasChild(st)) {
      photoGet("child").then((data) => applySpringboard(st.childName, data, {
        allowUpload: S.wantsA2hs(location.search),
      }));
    }
    const relayout = () => { if (document.getElementById("install-card") && surfaceNow() === "install") paintInstall(); };
    window.addEventListener("resize", relayout);
    window.addEventListener("orientationchange", () => setTimeout(relayout, 250));
    const watchingInstall = () => {
      if (isStandalone()) return false;
      if (surfaceNow() === "install") return true;
      try { return S.wantsA2hs(location.search); } catch (e) { return false; }
    };
    const markInstallLeft = () => {
      if (!watchingInstall()) return;
      try {
        sessionStorage.setItem("willo_install_left", "1");
        sessionStorage.removeItem("willo_install_again");
      } catch (e) {}
    };
    const resumeInstallCoach = () => {
      if (!watchingInstall()) return;
      if (surfaceNow() === "install") paintInstall();
    };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") markInstallLeft();
      else resumeInstallCoach();
    });
    window.addEventListener("pagehide", markInstallLeft);
    window.addEventListener("pageshow", resumeInstallCoach);
  }

  root.WilloUI = { openUnlock, openAddLang, boot, applyFaceImages, applyLangs, applyCatalog, renderHome, applySpringboard, forgetKidIcon };
})(typeof globalThis !== "undefined" ? globalThis : this);


function liedjesColCount(grid) {
  const tile = 154, gap = 20;
  const w = grid.clientWidth || grid.parentElement.clientWidth || 0;
  return Math.max(1, Math.floor((w + gap) / (tile + gap)));
}

function applyLiedjesOverflow(grid) {
  if (typeof assignOverflow !== "function") return;
  const tiles = [...grid.querySelectorAll(".tile-audio")];
  if (!tiles.length) return;
  const prefs = tiles.map(b => {
    if (!b.classList.contains("tile-pop")) return null;
    return (b.dataset.overPref || "").split(/\s+/).filter(Boolean);
  });
  const assigned = assignOverflow(prefs, liedjesColCount(grid), 20260817);
  tiles.forEach((b, i) => {
    if (!b.classList.contains("tile-pop")) return;
    b.classList.remove("over-left", "over-right", "over-top", "over-bottom");
    (assigned[i] || []).forEach(s => b.classList.add("over-" + s));
    b.dataset.over = (assigned[i] || []).join(" ");
  });
}

function refreshLiedjesOverflow() {
  document.querySelectorAll("section.liedjes .grid").forEach(applyLiedjesOverflow);
}

// --- Build sections ---
function visibleTracks() {
  const all = (typeof ALL_TRACKS !== "undefined") ? ALL_TRACKS : [];
  if (!window.WilloSettings) return all;
  const st = WilloSettings.load();
  const page = document.body.dataset.page;
  return all.filter(t => WilloSettings.isItemOn(st, t, page));
}

function build() {
  const bySection = { boeken: [], games: [], liedjes: [], verhalen: [] };
  visibleTracks().forEach(t => { if (bySection[t._section]) bySection[t._section].push(t); });

  for (const [section, tracks] of Object.entries(bySection)) {
    const grid = document.querySelector(`[data-grid="${section}"]`);
    const sec = document.querySelector(`section[data-section="${section}"]`);
    if (!grid || !sec) continue;
    if (tracks.length === 0) { sec.classList.add("empty"); continue; }
    if (section === "games") document.body.classList.add("has-games");
    tracks.forEach(track => {
      const btn = document.createElement("button");
      const isLiedjeAudio = section === "liedjes" && !!track.audio;
      btn.className = isLiedjeAudio ? "tile tile-audio" : "tile";
      if (isLiedjeAudio && /\.png(\?|$)/i.test(track.icon || "")) {
        btn.classList.add("tile-pop");
        if (Array.isArray(track.over) && track.over.length) {
          btn.dataset.overPref = track.over.join(" ");
        }
      }
      if (isLiedjeAudio && track.face) btn.style.setProperty("--face", track.face);
      btn.setAttribute("aria-label", `${track.title}`);
      const labelHtml = track.href ? `<div class="label">${track.title}</div>` : "";
      const faceHtml = isLiedjeAudio ? `<span class="tile-face" aria-hidden="true"></span>` : "";
      btn.innerHTML = `${faceHtml}<img src="${iconUrl(track)}" alt="">${labelHtml}`;
      attachTileHandlers(btn, track);
      grid.appendChild(btn);
    });
  }
}

// Wire bottom-bar buttons
const PAGE = document.body.dataset.page;  // "mama" | "papa" | "klas"
["mama", "papa", "klas"].forEach(name => {
  const btn = document.getElementById("nav-" + name);
  if (!btn) return;
  if (name === PAGE) btn.classList.add("active");
  attachBarButton(btn, { kind: "nav", href: btn.dataset.href, label: name, lockable: true });
});
attachBarButton(document.getElementById("stopbtn"), { kind: "stop", label: "stop", lockable: false });
(function () {
  const stop = document.getElementById("stopbtn");
  if (!stop) return;
  let hold = 0;
  stop.addEventListener("mousedown", () => {
    hold = setTimeout(() => { if (window.WilloUI) WilloUI.openUnlock(); }, 1800);
  });
  ["mouseup", "mouseleave"].forEach((ev) => stop.addEventListener(ev, () => clearTimeout(hold)));
})();

build();
if (window.WilloUI) WilloUI.boot();
refreshLiedjesOverflow();
requestAnimationFrame(refreshLiedjesOverflow);
let overResizeT = 0;
window.addEventListener("resize", () => {
  clearTimeout(overResizeT);
  overResizeT = setTimeout(refreshLiedjesOverflow, 80);
});
</script>
