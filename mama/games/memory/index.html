<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mémoire</title>
<style>
  :root{
    --cream:#fff7e6;
    --ink:#5a4632;
    --back1:#ffb347;
    --back2:#ff8c42;
    --accentA:#7ec8e3;
    --accentB:#a5d96b;
    --accentC:#f78fb3;
    --bar-h: 92px; --bar-pad: 10px; --bar-gap: 8px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow-x:hidden;
  }
  #confetti{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:300;
  }
  .screen{
    position:fixed;inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  .screen.active{display:flex;}

  /* Start screen — clear top chrome bar so title/choices are not under it */
  #start{
    justify-content:center;gap:6vh;padding:20px;
    padding-top: calc(var(--bar-h) + var(--bar-pad) * 2 + env(safe-area-inset-top, 0px) + 16px);
  }
  #start h1{
    font-size:clamp(48px,14vw,120px);
    margin:0;
    color:var(--back2);
    text-shadow:0 4px 0 rgba(0,0,0,.06);
    letter-spacing:2px;
  }
  .choices{
    display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:stretch;
    width:100%;max-width:760px;
  }
  .choice{
    flex:1 1 180px;min-width:160px;
    border:none;border-radius:28px;
    padding:28px 18px;cursor:pointer;
    color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .08s ease;
  }
  .choice:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .choice .num{font-size:clamp(44px,10vw,72px);font-weight:800;line-height:1;}
  .choice .word{font-size:clamp(18px,4vw,26px);font-weight:700;opacity:.95;}
  .choice .dots{font-size:clamp(20px,5vw,30px);letter-spacing:4px;}
  .c4{background:var(--accentB);}
  .c6{background:var(--accentA);}
  .c8{background:var(--accentC);}

  /* Game screen */
  #game{padding:calc(var(--bar-h) + 28px) 12px 12px 12px;justify-content:center;}
  .board{
    display:grid;
    gap:12px;
    margin:auto;
  }
  .card{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:20px;
    cursor:pointer;
    perspective:800px;
    background:transparent;
  }
  .inner{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.0,.2,1);
    border-radius:20px;
  }
  .card.up .inner,.card.matched .inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    border-radius:20px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
    box-shadow:0 6px 14px rgba(90,70,50,.16);
  }
  .back{
    background:linear-gradient(145deg,var(--back1),var(--back2));
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(32px,10vw,64px);
    color:rgba(255,255,255,.92);
  }
  .front{
    transform:rotateY(180deg);
    background:var(--cream);
  }
  .front img{
    width:100%;height:100%;object-fit:cover;display:block;
    pointer-events:none;
  }
  .card{touch-action:manipulation;}
  @keyframes wiggle{
    0%,100%{transform:translateX(0);}
    15%{transform:translateX(-8px) rotate(-3deg);}
    30%{transform:translateX(8px) rotate(3deg);}
    45%{transform:translateX(-6px) rotate(-2deg);}
    60%{transform:translateX(6px) rotate(2deg);}
    75%{transform:translateX(-3px);}
  }
  .card.wiggle{animation:wiggle .5s ease;}
  .card.matched{cursor:default;}
  .card.matched .inner{transform:rotateY(180deg) scale(.94);}
  .card.matched .front{box-shadow:0 0 0 4px var(--accentB),0 6px 14px rgba(90,70,50,.16);}

  /* Win overlay */
  #win{
    position:fixed;inset:0;z-index:250;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:5vh;
    background:rgba(255,247,230,.82);
    backdrop-filter:blur(2px);
  }
  #win.active{display:flex;}
  #win h2{
    font-size:clamp(40px,12vw,90px);margin:0;color:var(--back2);
    text-shadow:0 4px 0 rgba(0,0,0,.06);
  }
  .again{
    border:none;border-radius:28px;
    background:var(--accentB);color:#fff;
    font-size:clamp(24px,6vw,38px);font-weight:800;
    padding:22px 44px;cursor:pointer;
    box-shadow:0 8px 0 rgba(0,0,0,.12);
  }
  .again:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12);}

  /* Top nav chrome (stop + mama/papa/klas) */
  .bottombar { position: fixed; left:0; right:0; top:0; z-index:200; padding: max(var(--bar-pad), env(safe-area-inset-top)) var(--bar-pad) var(--bar-pad) var(--bar-pad); background: rgba(255,247,230,0.96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 2px 12px rgba(0,0,0,0.10); display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap: var(--bar-gap); }
  .bottombar > button { height: var(--bar-h); border-radius:18px; border:4px solid transparent; background:#fff; padding:0; overflow:hidden; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.12),0 8px 18px rgba(0,0,0,0.08); }
  .bottombar .navtile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .bottombar .navtile.active { border-color:#ff7043; box-shadow:0 0 0 3px rgba(255,112,67,0.25); }
  .bottombar .stopbtn { background:#e53935; border-color:#fff; display:flex; align-items:center; justify-content:center; }
  .bottombar .stopbtn svg { width:56%; height:56%; fill:#fff; pointer-events:none; }
  .bottombar > button:active { transform: scale(0.94); filter: brightness(1.12); }
</style>
<script>window.TEL_APP="mama-memory-v1";</script>
<script src="../tel.js"></script>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- START -->
<section id="start" class="screen active">
  <h1>Mémoire</h1>
  <div class="choices">
    <button class="choice c4" data-pairs="4">
      <span class="num">4</span>
      <span class="dots">★ ★</span>
      <span class="word">Facile</span>
    </button>
    <button class="choice c6" data-pairs="6">
      <span class="num">6</span>
      <span class="dots">★ ★ ★</span>
      <span class="word">Moyen</span>
    </button>
    <button class="choice c8" data-pairs="8">
      <span class="num">8</span>
      <span class="dots">★ ★ ★ ★</span>
      <span class="word">Difficile</span>
    </button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="board" id="board"></div>
</section>

<!-- WIN -->
<div id="win">
  <h2>Bravo !</h2>
  <button class="again" id="againBtn">Encore</button>
</div>

<nav class="bottombar" id="bottombar" aria-label="nav">
  <button class="navtile active" data-href="/willo/mama/" aria-label="mama"><img src="/willo/home/mama.jpg" alt=""></button>
  <button class="navtile" data-href="/willo/papa/" aria-label="papa"><img src="/willo/home/papa.jpg" alt=""></button>
  <button class="navtile" data-href="/willo/klas/" aria-label="klas"><img src="/willo/home/klas.jpg" alt=""></button>
  <button class="stopbtn" id="exitbtn" aria-label="exit"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
</nav>

<script>
(function(){
  "use strict";

  var ANIMALS = [];
  var screens = {
    start: document.getElementById('start'),
    game:  document.getElementById('game')
  };
  var board = document.getElementById('board');
  var winEl = document.getElementById('win');

  /* ---------- helpers ---------- */
  function show(name){
    for(var k in screens){ screens[k].classList.remove('active'); }
    if(screens[name]) screens[name].classList.add('active');
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
  }
  function pickAnimals(n){
    var pool = ANIMALS.slice();
    shuffle(pool);
    return pool.slice(0, Math.min(n, pool.length));
  }

  /* ---------- audio ---------- */
  var actx = null;
  function ensureAudio(){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state === 'suspended'){ actx.resume(); }
    }catch(e){}
    return actx;
  }

  // Reveal audio: spoken name, short gap, then a SHORT burst of animal sound.
  // Sound clips average ~3s; for memory we cap so flips stay snappy ("kort").
  var playToken = 0;
  var current = null;
  var SOUND_CAP_MS = 1200;
  var REVEAL_SAFETY_MS = 4500;
  function stopReveal(){
    playToken++;
    if(current){
      try{ current.pause(); current.currentTime = 0; }catch(e){}
      current = null;
    }
  }
  function playClip(src, token, onDone, maxMs){
    var finished = false;
    var capTimer = null;
    function finish(){
      if(finished || token !== playToken) return;
      finished = true;
      if(capTimer){ clearTimeout(capTimer); capTimer = null; }
      onDone();
    }
    try{
      if(current){ try{ current.pause(); }catch(e){} }
      current = new Audio("../" + src);
      var a = current;
      a.onended = finish;
      a.onerror = finish;
      if(maxMs && maxMs > 0){
        capTimer = setTimeout(function(){
          if(token !== playToken) return;
          try{ a.pause(); }catch(e){}
          finish();
        }, maxMs);
      }
      var p = a.play();
      if(p && p.catch){ p.catch(function(){ finish(); }); }
    }catch(e){
      finish();
    }
  }
  function playReveal(animal, onDone){
    var token = ++playToken;
    if(current){ try{ current.pause(); }catch(e){} current = null; }
    var finished = false;
    var safety = setTimeout(function(){
      if(token === playToken) done();
    }, REVEAL_SAFETY_MS);
    function done(){
      if(finished || token !== playToken) return;
      finished = true;
      clearTimeout(safety);
      if(onDone) onDone();
    }
    if(animal && animal.nameClip){
      playClip(animal.nameClip, token, function(){
        if(token !== playToken) return;
        setTimeout(function(){
          if(token !== playToken) return;
          if(animal.sound){
            playClip(animal.sound, token, done, SOUND_CAP_MS);
          } else {
            done();
          }
        }, 100);
      });
    } else if(animal && animal.sound){
      playClip(animal.sound, token, done, SOUND_CAP_MS);
    } else {
      done();
    }
  }

  // Shared voice FX (same Jaaaa / Neee on mama, papa, klas)
  var FX_BASE = "/willo/klas/games/fx/";
  var fxAudio = null;
  function playFx(file){
    try{
      if(fxAudio){ try{ fxAudio.pause(); }catch(e){} }
      fxAudio = new Audio(FX_BASE + file);
      var p = fxAudio.play();
      if(p && p.catch){ p.catch(function(){}); }
    }catch(e){}
  }

  // uh-oh: "Neee" + two short descending notes
  function uhOh(){
    playFx("neee.mp3");
    try{
      var ac = ensureAudio(); if(!ac) return;
      var seq=[{f:330,t:0},{f:247,t:0.22}];
      seq.forEach(function(s){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type='triangle'; o.frequency.value=s.f;
        var t=ac.currentTime + s.t;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.12,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t+0.24);
      });
    }catch(e){}
  }

  // clap/confetti: "Jaaaa" + synthesized applause
  function clap(dense){
    playFx("jaaa.mp3");
    try{
      var ac = ensureAudio(); if(!ac) return;
      var bursts = dense ? 28 : 12;
      var span = dense ? 0.9 : 0.65;
      // reusable noise buffer
      var len = Math.floor(ac.sampleRate * 0.18);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * (1 - i/len); }
      for(var b=0;b<bursts;b++){
        var src = ac.createBufferSource(); src.buffer = buf;
        var bp = ac.createBiquadFilter();
        bp.type='bandpass';
        bp.frequency.value = 900 + Math.random()*1600;
        bp.Q.value = 0.7 + Math.random();
        var g = ac.createGain();
        var t = ac.currentTime + Math.random()*span;
        var lvl = 0.12 + Math.random()*0.16;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(lvl,t+0.005);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.06+Math.random()*0.05);
        src.connect(bp); bp.connect(g); g.connect(ac.destination);
        src.start(t); src.stop(t+0.2);
      }
    }catch(e){}
  }

  // tiny WebAudio chime for the win celebration
  function chime(){
    try{
      var actx = ensureAudio(); if(!actx) return;
      var notes=[523.25,659.25,783.99,1046.5];
      notes.forEach(function(f,i){
        var o=actx.createOscillator(), g=actx.createGain();
        o.type='sine'; o.frequency.value=f;
        var t=actx.currentTime + i*0.12;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t+0.45);
      });
    }catch(e){}
  }

  /* ---------- confetti ---------- */
  var cv = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  var parts = [];
  var COLORS = ['#ffb347','#ff8c42','#7ec8e3','#a5d96b','#f78fb3','#ffe066','#c780e8'];
  function resize(){
    cv.width = window.innerWidth * (window.devicePixelRatio||1);
    cv.height = window.innerHeight * (window.devicePixelRatio||1);
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(x, y, count, power){
    var dpr = window.devicePixelRatio||1;
    for(var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var spd = (Math.random()*power + power*0.3);
      parts.push({
        x:x*dpr, y:y*dpr,
        vx:Math.cos(ang)*spd,
        vy:Math.sin(ang)*spd - power*0.5,
        g:0.35*dpr,
        size:(Math.random()*6+5)*dpr,
        color:COLORS[(Math.random()*COLORS.length)|0],
        life:1,
        rot:Math.random()*Math.PI,
        vr:(Math.random()-0.5)*0.3
      });
    }
    if(!raf) loop();
  }
  var raf = null;
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      p.life-=0.012;
      if(p.life<=0 || p.y>cv.height+50){ parts.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    }
    if(parts.length>0){ raf=requestAnimationFrame(loop); }
    else { ctx.clearRect(0,0,cv.width,cv.height); raf=null; }
  }
  function burstFullScreen(){
    var w=window.innerWidth, h=window.innerHeight;
    burst(w*0.5, h*0.45, 160, 22);
    setTimeout(function(){ burst(w*0.25,h*0.4,90,18); },180);
    setTimeout(function(){ burst(w*0.75,h*0.4,90,18); },340);
  }

  /* ---------- game state ---------- */
  var firstCard=null, lock=false, matchedCount=0, totalPairs=0;
  var totalFlips=0, mismatchCount=0, gameStart=0;
  var currentCards=0;

  /* ---------- responsive board layout ---------- */
  // Size cards to the #game content box (already padded for the top chrome).
  // Do NOT also subtract bar height from window — that double-counted after
  // the bar moved to the top and left cards too small / bottom gap.
  var GAP = 12;
  function layoutBoard(){
    var n = currentCards;
    if(!n) return;
    var gameEl = screens.game;
    var cs = window.getComputedStyle(gameEl);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    var availW = gameEl.clientWidth - padX;
    var availH = gameEl.clientHeight - padY;
    if(availW < 40) availW = 40;
    if(availH < 40) availH = 40;
    var best = 0, bestCols = 1;
    for(var cols=1; cols<=n; cols++){
      var rows = Math.ceil(n/cols);
      var cw = (availW - (cols-1)*GAP)/cols;
      var ch = (availH - (rows-1)*GAP)/rows;
      var size = Math.min(cw, ch);
      if(size > best){ best = size; bestCols = cols; }
    }
    best = Math.floor(best);
    board.style.gridTemplateColumns = 'repeat(' + bestCols + ',' + best + 'px)';
    board.style.gridAutoRows = best + 'px';
  }
  window.addEventListener('resize', layoutBoard);
  window.addEventListener('orientationchange', function(){ setTimeout(layoutBoard, 60); });

  function buildBoard(pairs){
    totalPairs = pairs;
    matchedCount = 0;
    firstCard = null;
    lock = false;
    totalFlips = 0;
    mismatchCount = 0;
    gameStart = Date.now();
    board.innerHTML = '';

    var chosen = pickAnimals(pairs);
    var deck = [];
    chosen.forEach(function(a){ deck.push(a); deck.push(a); });
    shuffle(deck);

    currentCards = deck.length;

    deck.forEach(function(a){
      var card=document.createElement('div');
      card.className='card';
      card.dataset.n=a.n;
      card._animal=a;
      card.innerHTML =
        '<div class="inner">'+
          '<div class="face back">?</div>'+
          '<div class="face front"><img alt="" src="../'+a.img+'"></div>'+
        '</div>';
      attachTap(card);
      board.appendChild(card);
    });

    layoutBoard();
  }

  /* ---------- reliable pointer taps ---------- */
  function attachTap(card){
    var st = null;
    card.addEventListener('pointerdown', function(e){
      ensureAudio();
      st = { x:e.clientX, y:e.clientY, t:Date.now() };
    });
    card.addEventListener('pointerup', function(e){
      if(!st){
        if(window.tel) window.tel("tap_reject",{reason:"off_card", dx:0, dy:0, ms:0});
        return;
      }
      var dx = e.clientX - st.x, dy = e.clientY - st.y;
      var moved = Math.sqrt(dx*dx + dy*dy);
      var dt = Date.now() - st.t;
      st = null;
      if(moved < 30 && dt < 800){
        onCard(card);
      } else {
        var reason = moved >= 30 ? "drift" : "too_long";
        if(window.tel) window.tel("tap_reject",{reason:reason, dx:dx, dy:dy, ms:dt});
      }
    });
    card.addEventListener('pointercancel', function(){ st = null; });
    card.addEventListener('pointerleave', function(){ /* keep st for slight slips */ });
  }

  // Same reliable-tap tolerance as attachTap(), for chrome buttons (play again,
  // level choice, exit, nav) that were still on fragile 'click' handlers.
  function attachButtonTap(el, handler){
    var st = null;
    el.addEventListener('pointerdown', function(e){ st = { x:e.clientX, y:e.clientY, t:Date.now() }; });
    el.addEventListener('pointerup', function(e){
      if(!st) return;
      var dx = e.clientX - st.x, dy = e.clientY - st.y;
      var moved = Math.sqrt(dx*dx + dy*dy);
      var dt = Date.now() - st.t;
      st = null;
      if(moved < 30 && dt < 800) handler(e);
    });
    el.addEventListener('pointercancel', function(){ st = null; });
  }

  function onCard(card){
    if(lock) return;
    if(card.classList.contains('matched')) return;
    if(card.classList.contains('up')) return;

    card.classList.add('up');
    totalFlips++;
    if(window.tel) window.tel("flip",{n:card._animal.n});

    if(!firstCard){
      firstCard = card;
      playReveal(card._animal);
      return;
    }

    // Second card: lock until name + sound finish, then match/mismatch.
    // (Previously stopSound ran immediately after the second flip, so the
    // second animal never really got heard.)
    lock = true;
    var a2 = firstCard, b2 = card;
    firstCard = null;
    var isMatch = a2.dataset.n === b2.dataset.n;

    playReveal(b2._animal, function(){
      if(isMatch){
        a2.classList.add('matched');
        b2.classList.add('matched');
        matchedCount++;
        if(window.tel) window.tel("match",{n:b2._animal.n});
        clap(false);
        celebrateMatch(b2);
        lock = false;
        if(matchedCount === totalPairs){
          setTimeout(win, 650);
        }
      } else {
        mismatchCount++;
        if(window.tel) window.tel("mismatch",{a:parseInt(a2.dataset.n,10), b:parseInt(b2.dataset.n,10)});
        uhOh();
        a2.classList.add('wiggle');
        b2.classList.add('wiggle');
        setTimeout(function(){
          a2.classList.remove('wiggle');
          b2.classList.remove('wiggle');
          a2.classList.remove('up');
          b2.classList.remove('up');
          stopReveal();
          lock = false;
        }, 850);
      }
    });
  }

  function celebrateMatch(card){
    var r=card.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2, 40, 14);
  }

  function win(){
    if(window.tel) window.tel("win",{pairs:totalPairs, flips:totalFlips, mismatches:mismatchCount, ms:Date.now()-gameStart});
    winEl.classList.add('active');
    stopReveal();
    chime();
    clap(true);
    burstFullScreen();
  }

  /* ---------- wiring ---------- */
  var animalsReady = null;
  function loadAnimals(){
    if(ANIMALS.length) return Promise.resolve(ANIMALS);
    if(animalsReady) return animalsReady;
    animalsReady = fetch('../animals.json')
      .then(function(r){
        if(!r.ok) throw new Error('animals ' + r.status);
        return r.json();
      })
      .then(function(data){
        ANIMALS = data || [];
        if(!ANIMALS.length) throw new Error('empty animals');
        return ANIMALS;
      })
      .catch(function(err){
        animalsReady = null;
        throw err;
      });
    return animalsReady;
  }

  function startGame(n){
    ensureAudio();
    if(window.tel) window.tel("level",{pairs:n});
    // Wait for animals.json — early tap used to build an empty board (blank screen).
    loadAnimals().then(function(){
      if(ANIMALS.length < 1){
        alert('Geen dieren geladen. Check verbinding en heropen.');
        return;
      }
      show('game');
      buildBoard(n);
      // layout while display:none measures 0×0 — reflow after show
      requestAnimationFrame(function(){ layoutBoard(); });
      setTimeout(layoutBoard, 50);
    }).catch(function(err){
      console.error(err);
      alert('Dieren laden mislukt. Heropen de app.');
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function(btn){
    attachButtonTap(btn, function(){
      var n = parseInt(btn.dataset.pairs,10);
      startGame(n);
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.bottombar .navtile'), function(btn){
    attachButtonTap(btn, function(){
      stopReveal();
      window.location = btn.dataset.href;
    });
  });

  attachButtonTap(document.getElementById('exitbtn'), function(){
    stopReveal();
    window.location = "/willo/mama/";
  });

  attachButtonTap(document.getElementById('againBtn'), function(){
    if(window.tel) window.tel("play_again",{});
    stopReveal();
    winEl.classList.remove('active');
    parts.length=0;
    show('start');
  });

  /* ---------- load data (prefetch) ---------- */
  loadAnimals().catch(function(){});

})();
</script>
<script src="/willo/scripts/willo-settings.js"></script>
<script src="/willo/scripts/willo-nav.js"></script>
</body>
</html>
