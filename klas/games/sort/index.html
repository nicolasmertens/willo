<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Big vs Small</title>
<style>
  :root{
    --cream:#fff7e6;
    --ink:#5a4632;
    --back1:#ffb347;
    --back2:#ff8c42;
    --accentA:#7ec8e3;
    --accentB:#a5d96b;
    --accentC:#f78fb3;
    --bar-h: 92px; --bar-pad: 10px; --bar-gap: 8px;
    /* Photocard side length (it's a 1:1 square). Zone heights below are
       derived FROM this so the neutral middle strip always exactly fits
       the card, at any viewport size, with a guaranteed clearance margin
       (no hand-tuned percentages that can drift out of sync). */
    --card-size: min(50vw,50vh,320px);
    --card-margin: 14px; /* clearance on each side of the card inside the strip */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow-x:hidden;
    overflow-y:hidden;
  }
  #confetti{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:300;
  }
  .screen{
    position:fixed;inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  .screen.active{display:flex;}

  /* Start screen */
  #start{justify-content:center;gap:6vh;padding:20px;}
  #start h1{
    font-size:clamp(36px,10vw,84px);
    margin:0;
    color:var(--back2);
    text-shadow:0 4px 0 rgba(0,0,0,.06);
    letter-spacing:1px;
    text-align:center;
  }
  .choices{
    display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:stretch;
    width:100%;max-width:760px;
  }
  .choice{
    flex:1 1 180px;min-width:160px;
    border:none;border-radius:28px;
    padding:28px 18px;cursor:pointer;
    color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.12);
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .08s ease;
  }
  .choice:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .choice .num{font-size:clamp(44px,10vw,72px);font-weight:800;line-height:1;}
  .choice .word{font-size:clamp(18px,4vw,26px);font-weight:700;opacity:.95;}
  .choice .dots{font-size:clamp(20px,5vw,30px);letter-spacing:4px;}
  .sc-easy{background:var(--accentB);}
  .sc-med{background:var(--accentA);}
  .sc-hard{background:var(--accentC);}

  /* Game screen: full-bleed top/bottom sort zones */
  #game{padding:0;}
  .sortstage{position:fixed;inset:0;}
  .zone{
    /* Height is derived from the card size + margin, NOT a fixed 50%, so a
       genuinely neutral strip (no zone underneath) always exists in the
       vertical middle for the photocard to live in — see --card-size /
       --card-margin above and .photocard below. */
    position:absolute;left:0;right:0;
    height:calc((100vh - var(--card-size))/2 - var(--card-margin));
    display:flex;flex-direction:column;align-items:center;
    touch-action:manipulation;
    transition:filter .2s ease;
    z-index:1;
    overflow:hidden;
  }
  #zoneTop{
    top:0;
    background:linear-gradient(180deg,#cdeefb,var(--accentA));
    justify-content:flex-start;
    padding-top:calc(var(--bar-h) + 34px);
  }
  #zoneBottom{
    bottom:0;
    background:linear-gradient(0deg,#d7f0bd,var(--accentB));
    justify-content:flex-end;
    padding-bottom:22px;
  }
  /* Ambient decoration: faded/desaturated silhouettes of other animals from
     the same size category, so each zone visually reads as "where big
     things live" / "where small things live", not just a color + word a
     21-month-old can't read yet. Pure decoration: pointer-events:none,
     low opacity, grayscale, sits behind the title text (z-index 0 vs the
     ztitle's implicit stacking) and never looks like a tap target. */
  .zone::before{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    z-index:0;
    background-repeat:no-repeat,no-repeat,no-repeat;
    filter:grayscale(1) contrast(.85);
    opacity:.16;
  }
  #zoneTop::before{
    /* elephant, giraffe, lion */
    background-image:url(../img/06.jpg),url(../img/21.jpg),url(../img/04.jpg);
    background-size:26vmin,22vmin,24vmin;
    background-position:3% 12%, 94% 8%, 50% 68%;
  }
  #zoneBottom::before{
    /* mouse, frog, bee */
    background-image:url(../img/41.jpg),url(../img/20.jpg),url(../img/23.jpg);
    background-size:15vmin,17vmin,12vmin;
    background-position:5% 88%, 93% 90%, 50% 22%;
  }
  .zone .ztitle{
    position:relative;z-index:1;
    font-weight:800;color:#fff;
    text-shadow:0 3px 0 rgba(0,0,0,.14);
    letter-spacing:1px;
  }
  #zoneTop .ztitle{font-size:clamp(40px,11vw,88px);}
  #zoneBottom .ztitle{font-size:clamp(18px,4.5vw,32px);}
  .zone.flash{filter:brightness(1.22);}
  .zone.pulse{animation:pulseZone .7s ease;}
  @keyframes pulseZone{
    0%,100%{filter:brightness(1);}
    50%{filter:brightness(1.35);}
  }

  .photocard{
    /* Horizontal anchor is left-of-center on purpose (parent asked for the
       card to sit toward the LEFT side of the screen, not centered).
       Anchor = half the card's own width + a constant 24px clearance, so
       the left edge always sits exactly 24px from the viewport edge at
       any --card-size (no clipping), while the card's center stays well
       left of the 50% mark at every tested width. Vertical stays
       top:50% / translateY(-50%), unchanged from the neutral-gap fix. */
    position:fixed;top:50%;left:calc(var(--card-size)/2 + 24px);
    width:var(--card-size);
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,.24),0 0 0 6px #fff;
    z-index:50;
    pointer-events:none;
    background:var(--cream);
  }
  .photocard img{width:100%;height:100%;object-fit:cover;display:block;}
  @keyframes wiggle{
    0%,100%{transform:translate(-50%,-50%) rotate(0);}
    15%{transform:translate(-50%,-50%) translateX(-10px) rotate(-4deg);}
    30%{transform:translate(-50%,-50%) translateX(10px) rotate(4deg);}
    45%{transform:translate(-50%,-50%) translateX(-7px) rotate(-2.5deg);}
    60%{transform:translate(-50%,-50%) translateX(7px) rotate(2.5deg);}
    75%{transform:translate(-50%,-50%) translateX(-3px);}
  }
  .photocard.wiggle{animation:wiggle .5s ease;}

  /* Win overlay */
  #win{
    position:fixed;inset:0;z-index:250;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:5vh;
    background:rgba(255,247,230,.82);
    backdrop-filter:blur(2px);
  }
  #win.active{display:flex;}
  #win h2{
    font-size:clamp(40px,12vw,90px);margin:0;color:var(--back2);
    text-shadow:0 4px 0 rgba(0,0,0,.06);
  }
  .again{
    border:none;border-radius:28px;
    background:var(--accentB);color:#fff;
    font-size:clamp(24px,6vw,38px);font-weight:800;
    padding:22px 44px;cursor:pointer;
    box-shadow:0 8px 0 rgba(0,0,0,.12);
  }
  .again:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12);}

  /* Bottom nav bar */
  .bottombar { position: fixed; left:0; right:0; top:0; z-index:200; padding: max(var(--bar-pad), env(safe-area-inset-top)) var(--bar-pad) var(--bar-pad) var(--bar-pad); background: rgba(255,247,230,0.96); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 2px 12px rgba(0,0,0,0.10); display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap: var(--bar-gap); }
  .bottombar > button { height: var(--bar-h); border-radius:18px; border:4px solid transparent; background:#fff; padding:0; overflow:hidden; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.12),0 8px 18px rgba(0,0,0,0.08); }
  .bottombar .navtile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .bottombar .navtile.active { border-color:#ff7043; box-shadow:0 0 0 3px rgba(255,112,67,0.25); }
  .bottombar .stopbtn { background:#e53935; border-color:#fff; display:flex; align-items:center; justify-content:center; }
  .bottombar .stopbtn svg { width:56%; height:56%; fill:#fff; pointer-events:none; }
  .bottombar > button:active { transform: scale(0.94); filter: brightness(1.12); }
</style>
<script>window.TEL_APP="klas-sort-v1";</script>
<script src="../tel.js"></script>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- START -->
<section id="start" class="screen active">
  <h1>Big vs Small</h1>
  <div class="choices">
    <button class="choice sc-easy" data-n="6">
      <span class="num">6</span>
      <span class="dots">★ ★</span>
      <span class="word">Easy</span>
    </button>
    <button class="choice sc-med" data-n="9">
      <span class="num">9</span>
      <span class="dots">★ ★ ★</span>
      <span class="word">Medium</span>
    </button>
    <button class="choice sc-hard" data-n="12">
      <span class="num">12</span>
      <span class="dots">★ ★ ★ ★</span>
      <span class="word">Hard</span>
    </button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="sortstage">
    <div class="zone" id="zoneTop"><span class="ztitle">BIG</span></div>
    <div class="zone" id="zoneBottom"><span class="ztitle">small</span></div>
  </div>
  <div class="photocard" id="photocard"><img id="photoImg" alt=""></div>
</section>

<!-- WIN -->
<div id="win">
  <h2>Yay!</h2>
  <button class="again" id="againBtn">Play again</button>
</div>

<nav class="bottombar" id="bottombar" aria-label="nav">
  <button class="navtile" data-href="/liedjes/mama/" aria-label="mama"><img src="/liedjes/home/mama.jpg" alt=""></button>
  <button class="navtile" data-href="/liedjes/papa/" aria-label="papa"><img src="/liedjes/home/papa.jpg" alt=""></button>
  <button class="navtile active" data-href="/liedjes/klas/" aria-label="klas"><img src="/liedjes/home/klas.jpg" alt=""></button>
  <button class="stopbtn" id="exitbtn" aria-label="exit"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
</nav>

<script>
(function(){
  "use strict";

  var ANIMALS = [];
  var screens = {
    start: document.getElementById('start'),
    game:  document.getElementById('game')
  };
  var winEl = document.getElementById('win');
  var zoneTop = document.getElementById('zoneTop');
  var zoneBottom = document.getElementById('zoneBottom');
  var photocard = document.getElementById('photocard');
  var photoImg = document.getElementById('photoImg');

  /* ---------- helpers ---------- */
  function show(name){
    for(var k in screens){ screens[k].classList.remove('active'); }
    if(screens[name]) screens[name].classList.add('active');
  }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=a[i];a[i]=a[j];a[j]=t;
    }
    return a;
  }
  function pickAnimals(n){
    var pool = ANIMALS.slice();
    shuffle(pool);
    return pool.slice(0, Math.min(n, pool.length));
  }

  /* ---------- audio (same house-style helpers as memory/index.html) ---------- */
  var actx = null;
  function ensureAudio(){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state === 'suspended'){ actx.resume(); }
    }catch(e){}
    return actx;
  }

  // gentle "uh-oh": two short descending notes
  function uhOh(){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var seq=[{f:330,t:0},{f:247,t:0.22}];
      seq.forEach(function(s){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type='triangle'; o.frequency.value=s.f;
        var t=ac.currentTime + s.t;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.12,t+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t+0.24);
      });
    }catch(e){}
  }

  // synthesized applause: bursts of bandpass-filtered white noise
  function clap(dense){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var bursts = dense ? 28 : 12;
      var span = dense ? 0.9 : 0.65;
      var len = Math.floor(ac.sampleRate * 0.18);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * (1 - i/len); }
      for(var b=0;b<bursts;b++){
        var src = ac.createBufferSource(); src.buffer = buf;
        var bp = ac.createBiquadFilter();
        bp.type='bandpass';
        bp.frequency.value = 900 + Math.random()*1600;
        bp.Q.value = 0.7 + Math.random();
        var g = ac.createGain();
        var t = ac.currentTime + Math.random()*span;
        var lvl = 0.12 + Math.random()*0.16;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(lvl,t+0.005);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.06+Math.random()*0.05);
        src.connect(bp); bp.connect(g); g.connect(ac.destination);
        src.start(t); src.stop(t+0.2);
      }
    }catch(e){}
  }

  // tiny WebAudio chime for the win celebration
  function chime(){
    try{
      var ac = ensureAudio(); if(!ac) return;
      var notes=[523.25,659.25,783.99,1046.5];
      notes.forEach(function(f,i){
        var o=ac.createOscillator(), g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        var t=ac.currentTime + i*0.12;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t+0.45);
      });
    }catch(e){}
  }

  /* ---------- confetti (same house-style helpers as memory/index.html) ---------- */
  var cv = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  var parts = [];
  var COLORS = ['#ffb347','#ff8c42','#7ec8e3','#a5d96b','#f78fb3','#ffe066','#c780e8'];
  function resize(){
    cv.width = window.innerWidth * (window.devicePixelRatio||1);
    cv.height = window.innerHeight * (window.devicePixelRatio||1);
  }
  window.addEventListener('resize', resize);
  resize();

  function burst(x, y, count, power){
    var dpr = window.devicePixelRatio||1;
    for(var i=0;i<count;i++){
      var ang = Math.random()*Math.PI*2;
      var spd = (Math.random()*power + power*0.3);
      parts.push({
        x:x*dpr, y:y*dpr,
        vx:Math.cos(ang)*spd,
        vy:Math.sin(ang)*spd - power*0.5,
        g:0.35*dpr,
        size:(Math.random()*6+5)*dpr,
        color:COLORS[(Math.random()*COLORS.length)|0],
        life:1,
        rot:Math.random()*Math.PI,
        vr:(Math.random()-0.5)*0.3
      });
    }
    if(!raf) loop();
  }
  var raf = null;
  function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(var i=parts.length-1;i>=0;i--){
      var p=parts[i];
      p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      p.life-=0.012;
      if(p.life<=0 || p.y>cv.height+50){ parts.splice(i,1); continue; }
      ctx.save();
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    }
    if(parts.length>0){ raf=requestAnimationFrame(loop); }
    else { ctx.clearRect(0,0,cv.width,cv.height); raf=null; }
  }
  function burstFullScreen(){
    var w=window.innerWidth, h=window.innerHeight;
    burst(w*0.5, h*0.45, 160, 22);
    setTimeout(function(){ burst(w*0.25,h*0.4,90,18); },180);
    setTimeout(function(){ burst(w*0.75,h*0.4,90,18); },340);
  }

  /* ---------- reliable pointer taps (same tolerance as memory/soundboard) ---------- */
  var MOVE_TOL = 30, TIME_TOL = 800;

  function attachZoneTap(zone, bucket){
    var st = null;
    zone.addEventListener('pointerdown', function(e){
      ensureAudio();
      st = { x:e.clientX, y:e.clientY, t:Date.now() };
    });
    zone.addEventListener('pointerup', function(e){
      if(!st){
        if(window.tel) window.tel("tap_reject",{reason:"off_zone", dx:0, dy:0, ms:0});
        return;
      }
      var dx = e.clientX - st.x, dy = e.clientY - st.y;
      var moved = Math.sqrt(dx*dx + dy*dy);
      var dt = Date.now() - st.t;
      st = null;
      if(moved < MOVE_TOL && dt < TIME_TOL){
        onZoneTap(bucket, zone);
      } else {
        var reason = moved >= MOVE_TOL ? "drift" : "too_long";
        if(window.tel) window.tel("tap_reject",{reason:reason, dx:dx, dy:dy, ms:dt});
      }
    });
    zone.addEventListener('pointercancel', function(){ st = null; });
  }

  // Same reliable-tap tolerance, for chrome buttons (play again, level choice,
  // exit, nav).
  function attachButtonTap(el, handler){
    var st = null;
    el.addEventListener('pointerdown', function(e){ st = { x:e.clientX, y:e.clientY, t:Date.now() }; });
    el.addEventListener('pointerup', function(e){
      if(!st) return;
      var dx = e.clientX - st.x, dy = e.clientY - st.y;
      var moved = Math.sqrt(dx*dx + dy*dy);
      var dt = Date.now() - st.t;
      st = null;
      if(moved < MOVE_TOL && dt < TIME_TOL) handler(e);
    });
    el.addEventListener('pointercancel', function(){ st = null; });
  }

  /* ---------- round state ---------- */
  var round = { items:[], idx:0, correctCount:0, itemCount:0, startTime:0 };
  var currentItem = null, presentedAt = 0, locked = true;

  function buildRound(n){
    round.items = pickAnimals(n);
    round.idx = 0;
    round.correctCount = 0;
    round.itemCount = round.items.length;
    round.startTime = Date.now();
    if(window.tel) window.tel("sort_level", {n:round.itemCount});
    showItem();
  }

  function showItem(){
    if(round.idx >= round.items.length){ finishRound(); return; }
    var a = round.items[round.idx];
    currentItem = a;
    presentedAt = Date.now();
    locked = false;
    photocard.style.transition = 'none';
    photocard.style.transform = 'translate(-50%,-50%) scale(1)';
    photocard.classList.remove('wiggle');
    // force reflow so the transition:none takes effect before re-enabling
    void photocard.offsetWidth;
    photocard.style.transition = '';
    photoImg.src = "../" + a.img;
    photoImg.alt = a.name || '';
    if(window.tel) window.tel("sort_present", {id:a.n, size:a.size});
  }

  function onZoneTap(bucket, zoneEl){
    if(locked || !currentItem) return;
    locked = true;
    var a = currentItem;
    var correct = (bucket === a.size) ? 1 : 0;
    var ms = Date.now() - presentedAt;
    if(window.tel) window.tel("sort_choice", {id:a.n, chosen:bucket, correct_val:a.size, correct:correct, ms:ms});

    if(correct){
      round.correctCount++;
      celebrateCorrect(zoneEl);
      setTimeout(nextItem, 900);
    } else {
      uhOh();
      photocard.classList.add('wiggle');
      setTimeout(function(){
        photocard.classList.remove('wiggle');
        autoCorrect(a);
      }, 700);
    }
  }

  function celebrateCorrect(zoneEl){
    clap(false);
    var r = photocard.getBoundingClientRect();
    burst(r.left+r.width/2, r.top+r.height/2, 40, 14);
    zoneEl.classList.add('flash');
    setTimeout(function(){ zoneEl.classList.remove('flash'); }, 500);
  }

  // Non-punitive auto-correct: slide the photo into the right zone so the
  // child sees the correct answer, then advance (no retry / dead-end).
  function autoCorrect(a){
    var targetZone = (a.size === 'big') ? zoneTop : zoneBottom;
    var tr = targetZone.getBoundingClientRect();
    var pr = photocard.getBoundingClientRect();
    var dx = (tr.left + tr.width/2) - (pr.left + pr.width/2);
    var dy = (tr.top + tr.height/2) - (pr.top + pr.height/2);
    photocard.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
    photocard.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(.5)';
    targetZone.classList.add('pulse');
    setTimeout(function(){
      targetZone.classList.remove('pulse');
      nextItem();
    }, 700);
  }

  function nextItem(){
    round.idx++;
    showItem();
  }

  function finishRound(){
    var ms = Date.now() - round.startTime;
    var k = round.correctCount, n = round.itemCount;
    if(window.tel) window.tel("sort_win", {n:n, correct:k, wrong:n-k, ms:ms});
    winEl.classList.add('active');
    chime();
    clap(true);
    burstFullScreen();
  }

  /* ---------- wiring ---------- */
  attachZoneTap(zoneTop, 'big');
  attachZoneTap(zoneBottom, 'small');

  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function(btn){
    attachButtonTap(btn, function(){
      ensureAudio();
      var n = parseInt(btn.dataset.n,10);
      buildRound(n);
      show('game');
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.bottombar .navtile'), function(btn){
    attachButtonTap(btn, function(){
      window.location = btn.dataset.href;
    });
  });

  attachButtonTap(document.getElementById('exitbtn'), function(){
    window.location = "/liedjes/klas/";
  });

  attachButtonTap(document.getElementById('againBtn'), function(){
    if(window.tel) window.tel("play_again",{});
    winEl.classList.remove('active');
    parts.length = 0;
    locked = true;
    currentItem = null;
    show('start');
  });

  /* ---------- load data ---------- */
  fetch('../animals.json')
    .then(function(r){ return r.json(); })
    .then(function(data){ ANIMALS = data || []; })
    .catch(function(){ ANIMALS = []; });

})();
</script>
</body>
</html>
